name: Reset After Bisect
module: module-12-advanced-git
level: level-178-git-bisect-reset
order: 178
difficulty: expert
xp: 380
expected_time: 14m
concepts:
- '`git bisect reset`'
common_mistakes:
- Running commands related to `git bisect reset` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git bisect
  reset``.
objective: 'Inspect the repository history and create `bisect.txt` containing exactly:


  `bad_commit=known`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git bisect reset``.
- Write the exact expected answer into `bisect.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > bisect.txt <<'EOF'\nbad_commit=known\n\
  EOF\n   ```\n\n2.\n   ```bash\n   git add bisect.txt\n   ```\n\n3.\n   ```bash\n\
  \   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Reset After Bisect**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: bisect.txt
  text: bad_commit=known
  description: bisect.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
