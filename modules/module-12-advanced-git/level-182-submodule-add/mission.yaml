name: Add a Submodule
module: module-12-advanced-git
level: level-182-submodule-add
order: 182
difficulty: expert
xp: 440
expected_time: 14m
concepts:
- git submodule add
- pinning a submodule to a tag
- .gitmodules and gitlinks
repo_path: infra-live
description: |
  The platform team keeps its Terraform VPC module in its own repository, `vpc-module`, and wants `infra-live` to consume it as a submodule under `modules/vpc`. The module has tags `v1.0.0` to `v1.3.0` and an unreleased commit on `main` that nobody has reviewed. Production must be pinned to `v1.2.0`, the last version the security team signed off.
objective: |
  Add the module as a submodule and pin it.

  1. Add `../vpc-module.git` (use this relative URL) as a submodule at `modules/vpc`.
  2. Check the submodule out at tag `v1.2.0`, not at the branch tip.
  3. Commit `.gitmodules` and the gitlink with a message starting `Add vpc module`.

  Since Git 2.38.1 a local-path submodule clone is refused by default, so run the add with `git -c protocol.file.allow=always ...`. The working tree must be clean afterwards.
hints:
- '`git submodule add <url> <path>` clones the repository, writes `.gitmodules` and stages both the file
  and the gitlink.'
- Right after the add the submodule sits on main's tip. Enter it (or use `git -C modules/vpc`) and `git
  checkout v1.2.0`.
- Stage the changed pointer with `git add modules/vpc`, then commit. `git submodule status` should show
  a SHA that `git describe --tags` in the module maps to v1.2.0.
guide: |
  ## Add

  ```bash
  git -c protocol.file.allow=always submodule add ../vpc-module.git modules/vpc
  ```

  The relative URL is resolved against the `origin` URL of the superproject, which is why teams use it for repos that live side by side.

  ## Pin

  ```bash
  git -C modules/vpc checkout v1.2.0
  git add modules/vpc
  git status --short       # A .gitmodules, A modules/vpc
  ```

  The superproject does not store the branch, it stores one commit SHA (a *gitlink*, mode 160000).

  ## Commit

  ```bash
  git commit -m "Add vpc module pinned to v1.2.0"
  git submodule status     # <sha> modules/vpc (v1.2.0)
  ```
debrief: |
  ## What a submodule is

  Two things are recorded in the superproject: the URL and path in `.gitmodules`, and an exact commit in the tree as an entry of mode `160000`. Nothing about branches or tags is stored; `v1.2.0` was just a convenient way to land on the right SHA.

  ## Why pinning matters

  Without the checkout step you would have committed the unreviewed tip of `main`. Everyone who clones the repo later receives exactly the commit you staged, which is the whole point: reproducible infrastructure.

  ## The file protocol

  CVE-2022-39253 made Git block `file://` transports inside submodule operations. Real remotes use https or ssh, so you only see this with local test repos.

  ## Related

  - `git submodule add -b <branch>` records a branch for `update --remote`.
  - `git submodule status` and `git diff --submodule` show pointer changes readably.
common_mistakes:
- Committing right after `submodule add`, so the pin is main's unreviewed tip instead of v1.2.0.
- Checking out the tag but forgetting `git add modules/vpc`, leaving the pointer change unstaged.
- Using an absolute path as URL; the team convention is the relative one.
validators:
- type: submodule_exists
  path: modules/vpc
  description: modules/vpc is a registered submodule
- type: script_passes
  description: The url in .gitmodules is the relative one
  script: 'test "$(git config -f .gitmodules submodule.modules/vpc.url)" = "../vpc-module.git"

    '
- type: script_passes
  description: The committed gitlink points at the commit of v1.2.0, not at main
  script: 'want=$(git -C ../remotes/vpc-module.git rev-parse ''v1.2.0^{commit}'')

    tip=$(git -C ../remotes/vpc-module.git rev-parse main)

    test "$want" != "$tip"

    got=$(git ls-tree HEAD modules/vpc | awk ''{print $1" "$3}'')

    test "$got" = "160000 $want"

    '
- type: script_passes
  description: The submodule working tree is checked out at that commit
  script: 'want=$(git -C ../remotes/vpc-module.git rev-parse ''v1.2.0^{commit}'')

    test "$(git -C modules/vpc rev-parse HEAD)" = "$want"

    '
- type: commit_message_contains
  text: Add vpc module
  description: The commit message starts with Add vpc module
- type: is_clean
  description: Nothing left uncommitted
