name: 'Git Bisect: Find the Bug'
module: module-12-advanced-git
level: level-176-git-bisect-intro
order: 176
difficulty: expert
xp: 400
expected_time: 14m
concepts:
- git bisect start / good / bad
- binary search through history
- git bisect reset
description: |
  You maintain the ground-station decoder for a cubesat downlink. Since last week every telemetry frame fails its checksum, but nobody can say which of the 28 commits broke it. Priya swears it was "the timing fix", Marek blames the new antenna settings. The repo ships `check.sh`, a small test that decodes two recorded frames and compares the checksums. It passed on the very first commit and fails on `main` today.
objective: |
  Find the first commit where `./check.sh` fails, using `git bisect` (do not just read 28 diffs).

  1. Write the full or abbreviated SHA of that commit into `culprit.txt` in the repository root.
  2. End the bisect session so the repo is back on branch `main` with no bisect in progress.

  Do not commit `culprit.txt`; the working tree must otherwise stay clean.
hints:
- Bisect needs one known-good and one known-bad commit. The root commit is good, `main` is bad. `git rev-list
  --max-parents=0 HEAD` prints the root.
- Start with `git bisect start`, mark the ends with `git bisect bad` and `git bisect good <sha>`, then
  run `./check.sh` at every commit Git checks out and answer with `good` or `bad`.
- Once Git prints "is the first bad commit", save `git rev-parse refs/bisect/bad` into culprit.txt and
  finish with `git bisect reset`.
guide: |
  ## Binary search through 28 commits

  `git bisect` halves the suspect range at every step, so 28 commits need about five tests.

  ```bash
  git bisect start
  git bisect bad HEAD                                   # today's main is broken
  git bisect good $(git rev-list --max-parents=0 HEAD)  # the root commit worked
  ```

  Git checks out a commit in the middle (detached HEAD). Run the test and tell Git the verdict:

  ```bash
  ./check.sh && git bisect good || git bisect bad
  ```

  Repeat until Git prints `<sha> is the first bad commit`. The verdict lives in a ref:

  ```bash
  git rev-parse refs/bisect/bad > culprit.txt
  git bisect reset      # back to main, bisect state removed
  ```

  Leaving the session open is the classic mistake: HEAD stays detached in the middle of history and the next commit you make lands in the wrong place.
debrief: |
  ## What just happened

  Bisect treats history as a sorted list: every commit before the culprit is good, every commit after is bad. A binary search finds the boundary in `log2(n)` steps. Here the suspects were a commit called "fix: decoder timing drift" (which only touched the baud rate) and the real culprit, a tuning commit that quietly changed the checksum modulus.

  ## Why it matters

  Commit messages describe intent, not effect. Bisect finds the real boundary with a mechanical test, so it works on repos you do not know and with commits written by people you cannot ask.

  ## Related

  - `git bisect log` prints your answers so far, `git bisect visualize` shows the remaining range.
  - `git bisect skip` marks an untestable commit.
  - `git bisect run <cmd>` automates the loop (next level).

  ## Pitfalls

  - Marking a commit wrongly poisons the search; re-run `git bisect replay` after editing the log.
  - Uncommitted changes can block the checkout of the next candidate.
common_mistakes:
- Reading the commit messages and guessing "the timing fix" instead of testing each candidate.
- Forgetting `git bisect reset`, leaving HEAD detached in the middle of history.
- Marking the root commit as bad or main as good because the arguments to good and bad were swapped.
validators:
- type: is_on_branch
  branch: main
  description: HEAD is back on branch main
- type: script_passes
  description: No bisect session is in progress
  script: 'test ! -f "$(git rev-parse --git-path BISECT_START)"

    test ! -s "$(git rev-parse --git-path BISECT_LOG)"

    '
- type: script_passes
  description: culprit.txt names the first commit where check.sh fails
  script: "test -f culprit.txt\nwant=\"\"\nfor c in $(git rev-list --reverse main); do\n  t=$(mktemp -d);\
    \ git archive \"$c\" | tar -x -C \"$t\"\n  if ! (cd \"$t\" && bash check.sh >/dev/null 2>&1); then\
    \ want=$c; rm -rf \"$t\"; break; fi\n  rm -rf \"$t\"\ndone\ntest -n \"$want\"\ngot=$(git rev-parse\
    \ --verify \"$(tr -d '[:space:]' < culprit.txt)^{commit}\")\ntest \"$got\" = \"$want\"\n"
- type: is_clean
  ignore_untracked: true
  description: No tracked file is modified
