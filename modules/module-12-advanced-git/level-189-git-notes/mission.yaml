name: Git Notes
module: module-12-advanced-git
level: level-189-git-notes
order: 189
difficulty: expert
xp: 420
expected_time: 14m
concepts:
- git notes --ref
- finding the commit that introduced a file
- pushing notes
repo_path: ledger-db
description: |
  The ledger service has seven numbered SQL migrations. The DBA team keeps a plain list of the ones that were actually applied to production in `prod-applied.txt` (untracked; it is not part of the repo). The release manager wants the repository itself to remember this, without rewriting any commit, so that anyone can see "applied to prod" next to a commit in `git log`. The commit messages do not mention migration numbers and some migrations were edited again after being added.
objective: |
  Record the deployment state with Git notes in the custom notes namespace `deploy`.

  1. For every migration listed in `prod-applied.txt`, find the commit that *introduced* that migration file (the commit that added it, not a later edit) and attach the note `applied: prod` to it with `git notes --ref=deploy`.
  2. Migrations that are not in the list must have no note.
  3. Publish the notes to `origin` (notes are not pushed by default): `origin` must have `refs/notes/deploy` identical to yours.
hints:
- '`git log --diff-filter=A --format=%H -- migrations/<file>` prints the commit that added a file; later
  edits are not matched.'
- '`git notes --ref=deploy add -m "applied: prod" <sha>` attaches a note; `git log --notes=deploy` shows
  them.'
- Notes live in `refs/notes/deploy`, and `git push origin refs/notes/deploy` publishes them.
guide: |
  ## Find the introducing commit

  ```bash
  cat prod-applied.txt
  git log --diff-filter=A --format='%h %s' -- migrations/0003_index_entries.sql
  ```

  `--diff-filter=A` keeps only commits where the path was *Added*, so edits such as "soften the index" are ignored.

  ## Attach the notes

  ```bash
  for f in $(cat prod-applied.txt); do
    c=$(git log --diff-filter=A --format=%H -- "migrations/$f")
    git notes --ref=deploy add -m "applied: prod" "$c"
  done
  git log --notes=deploy --oneline
  ```

  ## Share them

  ```bash
  git push origin refs/notes/deploy
  git ls-remote origin 'refs/notes/*'
  ```

  Without the explicit push, the notes exist only in your clone.
debrief: |
  ## Why notes

  A note is a separate object attached to a commit by SHA, stored in its own ref. The commit itself is untouched, so you can annotate history that is already published and cannot be rewritten, such as build results, review links or deployment records.

  ## Namespaces

  `--ref=deploy` stores the data in `refs/notes/deploy`. Different tools (CI, release management, code review) can each use their own namespace without colliding. The default namespace is `refs/notes/commits`.

  ## Pitfalls

  - `git push` and `git fetch` ignore notes unless you name the ref or configure refspecs (`remote.origin.fetch = +refs/notes/*:refs/notes/*`).
  - Rebases and amends create new commit SHAs; notes stay with the old commit unless you copy them (`notes.rewriteRef`).
  - A note is shown in `git log` only for namespaces you display with `--notes=<ref>`.

  ## Related

  - `git notes --ref=deploy list`, `show`, `remove`, `append`, `merge`.
common_mistakes:
- Annotating the commit that last touched the file (found via `git log -1 -- file`) instead of the one
  that added it.
- Adding notes in the default namespace and wondering why `--ref=deploy` shows nothing.
- Forgetting to push `refs/notes/deploy`, so other people never see the notes.
validators:
- type: script_passes
  description: Each applied migration has the note on the commit that added it
  script: "for f in $(cat prod-applied.txt); do\n  c=$(git log --diff-filter=A --format=%H -- \"migrations/$f\"\
    )\n  test \"$(git notes --ref=deploy show \"$c\")\" = \"applied: prod\"\ndone\n"
- type: script_passes
  description: Only the applied migrations carry a note
  script: 'n=$(wc -l < prod-applied.txt | tr -d '' '')

    test "$(git notes --ref=deploy list | wc -l | tr -d '' '')" = "$n"

    '
- type: script_passes
  description: origin has refs/notes/deploy identical to the local one
  script: test "$(git --git-dir=../origin.git rev-parse refs/notes/deploy)" = "$(git rev-parse refs/notes/deploy)"
