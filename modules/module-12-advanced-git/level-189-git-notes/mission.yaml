name: Git Notes
module: module-12-advanced-git
level: level-189-git-notes
order: 189
difficulty: expert
xp: 420
expected_time: 14m
concepts:
- "`git notes add` \u2014 annotate commits"
common_mistakes:
- "Running commands related to `git notes add` \u2014 annotate commits without checking\
  \ `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: "This repository contains a small history designed to practice ``git\
  \ notes add` \u2014 annotate commits`."
objective: 'Inspect the repository history and create `advanced-report.txt` containing
  exactly:


  `done=1`


  Then commit the report with the message `docs: add report`.'
hints:
- "Start with the Git command related to ``git notes add` \u2014 annotate commits`."
- Write the exact expected answer into `advanced-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > advanced-report.txt <<'EOF'\n\
  done=1\nEOF\n   ```\n\n2.\n   ```bash\n   git add advanced-report.txt\n   ```\n\n\
  3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Git Notes**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: advanced-report.txt
  text: done=1
  description: advanced-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
