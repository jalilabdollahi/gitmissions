name: Compare Two Commits
module: module-01-foundations
level: level-013-compare-two-commits
order: 13
difficulty: beginner
xp: 130
expected_time: 5m
concepts:
- '`git diff <hash1> <hash2>`'
common_mistakes:
- Running commands related to `git diff <hash1> <hash2>` without checking `git status`
  first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git diff
  <hash1> <hash2>``.
objective: 'Inspect the repository history and create `compare-report.txt` containing
  exactly:


  `difference=version line changed`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git diff <hash1> <hash2>``.
- Write the exact expected answer into `compare-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > compare-report.txt <<'EOF'\n\
  difference=version line changed\nEOF\n   ```\n\n2.\n   ```bash\n   git add compare-report.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Compare Two Commits**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: compare-report.txt
  text: difference=version line changed
  description: compare-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
