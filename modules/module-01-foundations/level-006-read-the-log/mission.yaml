name: Read the Log
module: module-01-foundations
level: level-006-read-the-log
order: 6
difficulty: beginner
xp: 100
expected_time: 5m
concepts:
- '`git log`'
- '`git log --oneline`'
common_mistakes:
- Running commands related to `git log`, `git log --oneline` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git log`,
  `git log --oneline``.
objective: 'Inspect the repository history and create `log-report.txt` containing
  exactly:


  `latest=Add release notes`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git log`, `git log --oneline``.
- Write the exact expected answer into `log-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > log-report.txt <<'EOF'\n\
  latest=Add release notes\nEOF\n   ```\n\n2.\n   ```bash\n   git add log-report.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Read the Log**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: log-report.txt
  text: latest=Add release notes
  description: log-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
