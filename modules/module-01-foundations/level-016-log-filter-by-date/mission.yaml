name: Filter Log by Date
module: module-01-foundations
level: level-016-log-filter-by-date
order: 16
difficulty: beginner
xp: 130
expected_time: 5m
concepts:
- '`git log --since= --until=`'
common_mistakes:
- Running commands related to `git log --since= --until=` without checking `git status`
  first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git log
  --since= --until=``.
objective: 'Inspect the repository history and create `date-report.txt` containing
  exactly:


  `matches=2`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git log --since= --until=``.
- Write the exact expected answer into `date-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > date-report.txt <<'EOF'\n\
  matches=2\nEOF\n   ```\n\n2.\n   ```bash\n   git add date-report.txt\n   ```\n\n\
  3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Filter Log by Date**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: date-report.txt
  text: matches=2
  description: date-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
