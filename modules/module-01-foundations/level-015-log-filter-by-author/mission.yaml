name: Filter Log by Author
module: module-01-foundations
level: level-015-log-filter-by-author
order: 15
difficulty: beginner
xp: 130
expected_time: 6m
concepts:
  - git log --author
  - author vs committer
description: |
  A neighbourhood library keeps its book catalogue in a CSV file under Git. The volunteers want to thank
  Marta Kowalski for her contributions, but the repository also has another volunteer called Marta Lindqvist,
  and one commit that Marta Kowalski only applied on behalf of someone else. The thank-you list must be accurate.
objective: |
  Create `kowalski-commits.txt` with the subject of every commit **authored** by `Marta Kowalski`
  (not Marta Lindqvist, and not commits she merely committed for somebody else), one subject per line,
  newest first. Do not change the history.
hints:
  - "`git log --format='%an | %cn | %s'` shows author and committer side by side. They are not always the same person."
  - "`git log --author=<pattern>` filters on the author. The pattern is a regular expression, so `Marta` alone matches both volunteers."
  - "`git log --author=\"Marta Kowalski\" --format=%s > kowalski-commits.txt`"
guide: |
  ## 1. Look at the people involved
  ```bash
  git log --format='%an <%ae> / committer %cn | %s'
  ```
  Two different Martas, and a commit by Leo that Marta Kowalski committed.

  ## 2. Filter precisely
  ```bash
  git log --author="Marta Kowalski" --format=%s
  ```
  Using the full name avoids the namesake. `--author` only looks at the author field, so the commit that Marta
  merely committed for Leo is correctly excluded.

  ## 3. Save
  ```bash
  git log --author="Marta Kowalski" --format=%s > kowalski-commits.txt
  ```
debrief: |
  ## What happened
  Every commit stores two identities: the **author** (who wrote the change) and the **committer** (who recorded it).
  They differ when a patch is applied, cherry-picked or rebased by someone else. `--author` filters on the first,
  `--committer` on the second.

  ## Why it matters
  Credit, audits and "who do I ask about this change" all depend on the correct person. A sloppy filter can
  credit the wrong volunteer.

  ## Related
  - `--author` accepts a regex: `--author='Marta (K|L)'` or `--author=marta.k@`.
  - `git shortlog -sne` counts commits by author with emails.
  - `--invert-grep` and `--committer=` complete the family of filters.

  ## Pitfalls
  - A short pattern may match several people. Check with `%an %ae` first.
  - Authors are free text; the same person may appear with several spellings (see `.mailmap`).
common_mistakes:
  - Using `--author=Marta`, which includes Marta Lindqvist's commits.
  - Filtering with `--committer`, which wrongly adds the commit authored by Leo.
  - Saving hashes or `--oneline` output instead of bare subjects.
validators:
  - type: script_passes
    script: test -s kowalski-commits.txt && test "$(cat kowalski-commits.txt)" = "$(git log --author='Marta Kowalski' --format=%s)"
    description: kowalski-commits.txt lists the subjects of Marta Kowalski's authored commits, newest first
  - type: script_passes
    script: '! grep -q -e Ulysses -e Emma -e Hamlet kowalski-commits.txt'
    description: The namesake's commits and the patch from Leo are not listed
  - type: commit_count_eq
    count: 8
    description: History is unchanged
