name: Filter Log by Author
module: module-01-foundations
level: level-015-log-filter-by-author
order: 15
difficulty: beginner
xp: 130
expected_time: 5m
concepts:
- '`git log --author=`'
common_mistakes:
- Running commands related to `git log --author=` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git log
  --author=``.
objective: 'Inspect the repository history and create `author-report.txt` containing
  exactly:


  `matches=2`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git log --author=``.
- Write the exact expected answer into `author-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > author-report.txt <<'EOF'\n\
  matches=2\nEOF\n   ```\n\n2.\n   ```bash\n   git add author-report.txt\n   ```\n\
  \n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Filter Log by Author**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: author-report.txt
  text: matches=2
  description: author-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
