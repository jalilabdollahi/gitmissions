name: Pretty Log Formats
module: module-01-foundations
level: level-014-log-pretty-formats
order: 14
difficulty: beginner
xp: 130
expected_time: 6m
concepts:
  - git log --pretty=format:
  - placeholders %h %an %s
description: |
  The Night Shift Radio podcast keeps its show notes in Git, and the producer wants an automatic credits page:
  one line per commit, in a fixed layout that a script can parse. The default `git log` output with its
  multi-line blocks is useless for that, but Git can print exactly the fields you ask for.
objective: |
  Generate `changelog.txt` containing one line per commit, newest first, in the exact layout
  `<short hash> | <author name> | <subject>` (for example `a1b2c3d | Sven | Start show notes`; the separators are
  a space, a pipe and a space). Use Git's own formatting for it rather than typing the lines by hand.
hints:
  - "`git log --pretty=format:\"...\"` takes a template. Placeholders start with `%`."
  - "`%h` is the abbreviated hash, `%an` the author name and `%s` the subject."
  - "`git log --pretty=format:'%h | %an | %s' > changelog.txt`"
guide: |
  ## 1. Start from a template
  ```bash
  git log --pretty=format:'%h | %an | %s'
  ```
  Everything outside the `%` placeholders is printed literally, so spaces and pipes appear as you typed them.

  ## 2. Placeholders you will use most
  | code | meaning |
  |---|---|
  | `%H` / `%h` | full / short hash |
  | `%an` / `%ae` | author name / email |
  | `%ad` / `%ar` | author date / relative date |
  | `%s` / `%b` | subject / body |

  ## 3. Save it
  ```bash
  git log --pretty=format:'%h | %an | %s' > changelog.txt
  ```
debrief: |
  ## What happened
  `--pretty=format:` lets you define the output of `git log` yourself. Because it is generated from
  the repository, the result is always correct and reproducible, unlike text typed by hand.

  ## Why it matters
  Changelogs, release notes, CI dashboards and shell scripts all rely on machine-readable log output.
  The default view is for humans, formats are for programs.

  ## Related
  - `--oneline` is shorthand for `--pretty=oneline --abbrev-commit`.
  - `--date=short` changes the date style used by `%ad`.
  - `tformat:` adds a trailing newline after the last entry, `format:` does not.
  - `git shortlog -sn` counts commits per author.

  ## Pitfalls
  - Use single quotes so the shell does not interpret `|` or `%`.
  - Each placeholder is case sensitive: `%an` is the author, `%cn` the committer.
common_mistakes:
  - Using double quotes with `!` or `$` characters in the template, which the shell may expand.
  - Writing `%h` as `%H`, producing 40-character hashes.
  - Using `--oneline` and then trying to reshape the output with search and replace.
validators:
  - type: file_exists
    path: changelog.txt
    description: changelog.txt exists
  - type: script_passes
    script: test "$(cat changelog.txt)" = "$(git log --pretty=format:'%h | %an | %s')"
    description: Every line follows "<hash> | <author> | <subject>" for all commits, newest first
  - type: script_passes
    script: test "$(wc -l < changelog.txt | tr -d ' ')" -ge 5
    description: All six commits are listed
  - type: commit_count_eq
    count: 6
    description: History is unchanged
