name: Pretty Log Formats
module: module-01-foundations
level: level-014-log-pretty-formats
order: 14
difficulty: beginner
xp: 130
expected_time: 5m
concepts:
- '`--pretty=format:`'
- '`%H %s %an`'
common_mistakes:
- Running commands related to `--pretty=format:`, `%H %s %an` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``--pretty=format:`,
  `%H %s %an``.
objective: 'Inspect the repository history and create `pretty-log.txt` containing
  exactly:


  `Alice: Add release notes`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``--pretty=format:`, `%H %s %an``.
- Write the exact expected answer into `pretty-log.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > pretty-log.txt <<'EOF'\n\
  Alice: Add release notes\nEOF\n   ```\n\n2.\n   ```bash\n   git add pretty-log.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Pretty Log Formats**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: pretty-log.txt
  text: 'Alice: Add release notes'
  description: pretty-log.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
