name: Read the Status
module: module-01-foundations
level: level-003-check-status
order: 3
difficulty: beginner
xp: 100
expected_time: 5m
concepts:
- '`git status` output: staged/unstaged/untracked'
common_mistakes:
- 'Running commands related to `git status` output: staged/unstaged/untracked without
  checking `git status` first, which hides the actual repository state.'
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: 'This repository contains a small history designed to practice ``git
  status` output: staged/unstaged/untracked`.'
objective: 'Inspect the repository history and create `status-report.txt` containing
  exactly:


  `staged=1

  unstaged=1

  untracked=1`


  Then commit the report with the message `docs: add report`.'
hints:
- 'Start with the Git command related to ``git status` output: staged/unstaged/untracked`.'
- Write the exact expected answer into `status-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > status-report.txt <<'EOF'\n\
  staged=1\nunstaged=1\nuntracked=1\nEOF\n   ```\n\n2.\n   ```bash\n   git add status-report.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Read the Status**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: status-report.txt
  text: 'staged=1

    unstaged=1

    untracked=1'
  description: status-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
