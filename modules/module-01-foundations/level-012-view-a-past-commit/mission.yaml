name: View a Past Commit
module: module-01-foundations
level: level-012-view-a-past-commit
order: 12
difficulty: beginner
xp: 120
expected_time: 5m
concepts:
- '`git show <hash>`'
common_mistakes:
- Running commands related to `git show <hash>` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git show
  <hash>``.
objective: 'Inspect the repository history and create `past-commit.txt` containing
  exactly:


  `subject=Initial scaffold`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git show <hash>``.
- Write the exact expected answer into `past-commit.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > past-commit.txt <<'EOF'\n\
  subject=Initial scaffold\nEOF\n   ```\n\n2.\n   ```bash\n   git add past-commit.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **View a Past Commit**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: past-commit.txt
  text: subject=Initial scaffold
  description: past-commit.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
