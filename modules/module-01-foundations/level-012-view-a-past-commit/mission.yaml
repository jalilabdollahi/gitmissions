name: View a Past Commit
module: module-01-foundations
level: level-012-view-a-past-commit
order: 12
difficulty: beginner
xp: 120
expected_time: 6m
concepts:
  - git show <commit>
  - reading a commit's patch
  - commit:path syntax
description: |
  A friend's board-game rules live in a Git repository. During a playtest, Priya changed the winning score in a
  commit with a vague message, and later other people changed it again. The group now argues about "what
  Priya's version said". The current file does not tell you, only that one commit does.
objective: |
  Find the single commit authored by Priya and look at what it changed. Write the number of points needed to
  win **as it was after Priya's commit** (not the current value) to `winning-score.txt`, as digits only.
  Do not alter the history.
hints:
  - "`git log` shows the author of every commit. You need the one by Priya; `git log --author=Priya` filters for her."
  - "`git show <hash>` prints the commit's message and patch. The file's current content is a different snapshot than the one after her commit."
  - "`git show <hash>:rules/scoring.md` prints a file as it was in that commit. Redirect just the number into winning-score.txt."
guide: |
  ## 1. Find her commit
  ```bash
  git log --oneline --author=Priya
  ```

  ## 2. Look at it
  ```bash
  git show <hash>
  ```
  The patch marks the old line with `-` and the new line with `+`.

  ## 3. Beware of later changes
  Two more commits changed the same sentence afterwards. `cat rules/scoring.md` shows the **latest** number, not
  Priya's. To see the file as it was just after her commit:
  ```bash
  git show <hash>:rules/scoring.md
  ```

  ## 4. Save the answer
  ```bash
  echo 25 > winning-score.txt
  ```
  (Use the number you actually found.)
debrief: |
  ## What happened
  `git show` displays one commit: metadata plus the diff against its parent. The `<commit>:<path>`
  form addresses a file inside a snapshot, which lets you read any file at any point in history without
  checking anything out.

  ## Why it matters
  Arguments about "who changed what" are settled by reading the evidence. `git show` is also the
  first step before reverting, cherry-picking or blaming a change.

  ## Related
  - `git show --stat <hash>` lists files only; `git show HEAD~3` uses relative names.
  - `git log -p <path>` shows the full history of one file.
  - `git diff <a> <b>` compares any two snapshots (next missions).

  ## Pitfalls
  - A hash is enough with just the first 7 or so characters.
  - Do not confuse `git show` of a commit (the change) with `commit:path` (the file contents).
common_mistakes:
  - Reading the current `rules/scoring.md` and writing 30, which is the value after later commits.
  - Writing the old value (the line starting with `-`) instead of the new one.
  - Writing text such as "25 points" instead of just the digits.
validators:
  - type: script_passes
    script: test "$(tr -d '[:space:]' < winning-score.txt)" = "$(git show "$(git log --author=Priya --format=%H)":rules/scoring.md | grep -o '[0-9][0-9]* points' | grep -o '[0-9]*')"
    description: winning-score.txt holds the score from Priya's commit
  - type: script_passes
    script: grep -qx '[0-9][0-9]*' winning-score.txt
    description: The file contains digits only
  - type: commit_count_eq
    count: 6
    description: History is unchanged
