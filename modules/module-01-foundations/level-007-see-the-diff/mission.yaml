name: See the Diff
module: module-01-foundations
level: level-007-see-the-diff
order: 7
difficulty: beginner
xp: 100
expected_time: 5m
concepts:
- '`git diff`'
- '`git diff --staged`'
common_mistakes:
- Running commands related to `git diff`, `git diff --staged` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git diff`,
  `git diff --staged``.
objective: 'Inspect the repository history and create `diff-report.txt` containing
  exactly:


  `changed_line=version=2`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git diff`, `git diff --staged``.
- Write the exact expected answer into `diff-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > diff-report.txt <<'EOF'\n\
  changed_line=version=2\nEOF\n   ```\n\n2.\n   ```bash\n   git add diff-report.txt\n\
  \   ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **See the Diff**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: diff-report.txt
  text: changed_line=version=2
  description: diff-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
