name: The Final Incident
module: module-14-war-games
level: level-225-wargame-final-incident
order: 225
difficulty: expert
xp: 800
expected_time: 25m
concepts:
- recovering a force-pushed remote branch from a remote-tracking reflog
- recovering a deleted local branch from the HEAD reflog
- failing pre-push hook, merge conflicts, non-force push
repo_path: work
description: |
  Everything went wrong on the same afternoon in the orbit-platform repo. (1) The CI bot force-pushed `release/3.0` and erased Ines's and Tomas's two release commits; the bot's own commit adds a build artifact file. Your clone fetched the damage, but `origin/release/3.0` still has its previous tip in its reflog. (2) Your own `hotfix/tls` branch (two commits: stronger TLS, HSTS plus a version bump) was deleted by a clean-up with `git branch -D`. (3) The pre-push hook runs `./check.sh`, which rejects pushes while build artifacts are committed or the chart and app versions differ. (4) Your hotfix and the lost release commits edit the same lines. The server must receive everything in a single, fast-forward push.
objective: |
  Put the release branch back together and push it.

  1. Create a local `release/3.0` from `origin/release/3.0` (the CI bot's state) and bring back the two lost release commits (`release: freeze tls config` and `release: bump chart to 3.0.2`) and your two hotfix commits (`tls: require 1.3 and modern ciphers` and `tls: add hsts and bump to 3.0.1`). Find all of them via the reflogs.
  2. Resolve the conflicts so that `deploy/values.yaml` has `minVersion: "1.3"`, `ciphers: modern`, `hsts: true` and `appVersion: 3.0.2`, and `Chart.yaml` has `version: 3.0.2`.
  3. Remove the committed build artifact `artifacts.txt`.
  4. Push `release/3.0` to `origin` through the unchanged pre-push hook, without `--force`: the bot's commit must be an ancestor of the new `origin/release/3.0`.
hints:
- '`git reflog show origin/release/3.0` lists the remote-tracking ref''s history; `@{1}` is the tip before
  the forced update. `git reflog` (HEAD) holds your hotfix commits, including the last one, even though
  the branch is gone.'
- Merge both old tips into the new branch (`git merge <sha>`), or cherry-pick. The second merge conflicts
  in `deploy/values.yaml` and `Chart.yaml`; version must be 3.0.2 everywhere because the `check.sh` compares
  them.
- 'Run `./check.sh` yourself first: it tells you what the hook will complain about (artifacts, versions,
  markers). Then `git push origin release/3.0`.'
guide: |
  ## Recover the lost commits

  ```bash
  git reflog show origin/release/3.0        # @{0} bot, @{1} the real tip (r3)
  git log --oneline origin/release/3.0@{1}  # r2, r3 below it
  git reflog | grep 'tls: add hsts'          # the hotfix tip, branch deleted
  ```

  ## Rebuild the branch

  ```bash
  git switch -c release/3.0 origin/release/3.0
  git merge --no-edit 'origin/release/3.0@{1}'     # the two release commits
  git merge <hotfix-tip>                           # conflicts: values.yaml, Chart.yaml
  ```

  Resolve the conflicts so both files match the objective (version 3.0.2 in both), then:

  ```bash
  git rm -q artifacts.txt
  ./check.sh
  git add -A && git commit --no-edit
  ```

  ## Push through the hook

  ```bash
  git push origin release/3.0           # pre-push runs ./check.sh
  ```

  A normal push works because the new tip contains the bot's commit.
debrief: |
  ## Four independent failures

  1. **Force-push**: only the server lost commits. Your remote-tracking ref has a reflog that records each fetch, so the old tip survives locally.
  2. **Deleted branch**: the branch name vanished, the commits live on in HEAD's reflog.
  3. **Hook**: `pre-push` enforces repository rules (no artifacts, consistent versions). Fix the cause; do not skip it.
  4. **Conflicts**: the semantic rule is the only guide. `check.sh` encodes it: `Chart.yaml` and `values.yaml` must agree.

  ## Merging versus rebuilding

  Merging the recovered tips on top of the bot's commit keeps every original SHA (so any tooling that referenced r2, r3 or your hotfix still finds them) and keeps the server history fast-forwardable.

  ## Make it harder to repeat

  Protect release branches on the server (no force-push, required checks), keep artifacts out of Git with `.gitignore` and run `check.sh` in CI, not only in a client hook.

  ## Related

  - `git reflog show origin/<branch>` and `git log -g` for remote-tracking refs.
  - `git merge-base --is-ancestor` to confirm a push will be a fast-forward.
  - `git rebase --rebase-merges` as a different way to replay the lost work.
common_mistakes:
- Using `--no-verify` or `--force` to get the push through, which the hook and the server policy exist
  to prevent.
- Merging only the release commits, or only the hotfix, and thinking the job is done.
- Resolving `Chart.yaml` to 3.0.1 (the hotfix bump) while the app version is 3.0.2, which `check.sh` rejects.
validators:
- type: script_passes
  description: origin/release/3.0 contains the two lost release commits and both hotfix commits
  script: "o=\"git --git-dir=../origin.git\"\nfor s in \"release: freeze tls config\" \"release: bump\
    \ chart to 3.0.2\" \"tls: require 1.3 and modern ciphers\" \"tls: add hsts and bump to 3.0.1\"; do\n\
    \  $o log release/3.0 --format=%s | grep -qx \"$s\"\ndone\n"
- type: script_passes
  description: The push was a fast-forward over the bot's commit
  script: 'o="git --git-dir=../origin.git"

    bot=$($o log release/3.0 --format=%H --grep=''^ci: rebuild artifacts$'' -1)

    $o merge-base --is-ancestor "$bot" release/3.0

    test "$($o rev-parse release/3.0)" = "$(git rev-parse release/3.0)"

    '
- type: script_passes
  description: Merged files follow the rules and the artifact is gone
  script: 'grep -q ''minVersion: "1.3"'' deploy/values.yaml

    grep -q ''ciphers: modern'' deploy/values.yaml

    grep -q ''hsts: true'' deploy/values.yaml

    grep -q ''appVersion: 3.0.2'' deploy/values.yaml

    grep -q ''version: 3.0.2'' Chart.yaml

    test ! -e artifacts.txt

    ! git grep -qE ''^(<<<<<<<|=======|>>>>>>>)''

    '
- type: script_passes
  description: The server tip passes check.sh
  script: 't=$(mktemp -d); git --git-dir=../origin.git archive release/3.0 | tar -x -C "$t"

    (cd "$t" && sh ./check.sh)

    rm -rf "$t"

    '
- type: script_passes
  description: The pre-push hook is unchanged
  script: 'grep -q ''gm-hook: pre-push'' .git/hooks/pre-push

    grep -q ''sh ./check.sh'' .git/hooks/pre-push

    test "$(git config core.hooksPath)" = ".git/hooks"

    '
- type: script_passes
  description: Local release/3.0 equals origin and the tree is clean
  script: 'test "$(git rev-parse release/3.0)" = "$(git rev-parse origin/release/3.0)"

    test -z "$(git status --porcelain)"'
