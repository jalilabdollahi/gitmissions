name: Tag Pollution
module: module-14-war-games
level: level-220-wargame-tag-pollution
order: 220
difficulty: expert
xp: 650
expected_time: 18m
concepts:
- deleting many tags locally and on the remote
- moving a release tag
- fetch.prune and fetch.pruneTags
repo_path: work
description: |
  A misconfigured CI job pushed 36 lightweight tags named `build-1` to `build-36` to the chart museum's `origin`, and every developer who fetched got them too (three more, `build-local-1..3`, exist only in your clone). In the noise, nobody noticed that the real release tag `v1.3.1` was created too early by the same job: it sits on the commit before the actual hotfix. Package consumers who install `v1.3.1` get the broken chart. You must clean the tag namespace on both sides, fix the release tag and make sure the junk does not come back with the next fetch.
objective: |
  1. Delete every tag matching `build-*` from `origin` (use a single push, not 36) and from your clone, including the three local-only ones. The remaining tags are exactly `v1.0.0`, `v1.1.0`, `v1.2.0`, `v1.3.0` and `v1.3.1`, identical locally and on origin.
  2. Recreate `v1.3.1` as an annotated tag on the hotfix commit `fix: chart appVersion for 1.3.1`, locally and on `origin`.
  3. Set `fetch.prune` and `fetch.pruneTags` to `true` in this repository's config.
hints:
- '`git tag -l ''build-*''` lists them. `git push origin --delete` accepts many refs in one call, so build
  the list with `git tag -l` and prefix each with `refs/tags/`.'
- '`git tag -d $(git tag -l ''build-*'')` deletes locally, and works for the local-only ones as well.'
- 'A moved tag needs `git tag -f -a v1.3.1 -m "..." <commit>` and a forced push of that one ref: `git
  push --force origin refs/tags/v1.3.1`.'
guide: |
  ## Look at the mess

  ```bash
  git tag -l | wc -l
  git ls-remote --tags origin | grep -c build-
  git log --oneline --decorate -4        # v1.3.1 is one commit too early
  ```

  ## Delete in bulk

  ```bash
  git push origin --delete $(git tag -l 'build-*' | sed 's#^#refs/tags/#')
  git tag -d $(git tag -l 'build-*')
  git tag -l
  ```

  ## Move the release tag

  ```bash
  hf=$(git log -1 --format=%H --grep='fix: chart appVersion for 1.3.1' main)
  git tag -f -a v1.3.1 -m "Release 1.3.1" "$hf"
  git push --force origin refs/tags/v1.3.1
  ```

  ## Keep the namespace clean

  ```bash
  git config fetch.prune true
  git config fetch.pruneTags true
  ```

  With these set, `git fetch` removes local branches and tags that no longer exist on the remote.
debrief: |
  ## Tags are shared, mutable-by-force refs

  Pushing a tag publishes it into a global namespace that every clone fetches. Deleting one on the server does *not* delete it in other clones: `git fetch` keeps tags it already has unless pruning is configured. That is why `fetch.pruneTags` is the real fix for leaked tags.

  ## Moving a release tag

  Normally tags never move. If a release tag points at the wrong commit and has been consumed, the safest option is a new version; here the tag was minutes old and the CI job was the only consumer, so moving it was acceptable. Always announce it; clones will not update an existing tag on fetch without `--force`.

  ## One push for many refs

  `git push origin --delete ref1 ref2 ...` is one connection and one atomic-ish request. Looping 36 times works but is slow and noisy.

  ## Related

  - `git push origin :refs/tags/<name>` is the old delete syntax.
  - `git ls-remote --tags origin` reads the server state without fetching.
  - `git tag -l 'build-*' | xargs -n1 ...` for per-tag operations.
common_mistakes:
- Deleting only on the server and forgetting the local clone (the junk is pushed back by the next `git
  push --tags`).
- Retagging with `git tag v1.3.1 <commit>` without `-f`, which fails, or with `-f` locally but never forcing
  the push.
- Deleting `v*` tags with the glob `*1*` or similar patterns that match real releases.
validators:
- type: script_passes
  description: The tag set is exactly the five releases, locally and on origin
  script: 'exp="v1.0.0

    v1.1.0

    v1.2.0

    v1.3.0

    v1.3.1"

    test "$(git tag -l | sort)" = "$exp"

    test "$(git --git-dir=../origin.git tag -l | sort)" = "$exp"

    '
- type: script_passes
  description: v1.3.1 is an annotated tag on the hotfix commit, locally and on origin
  script: 'o="git --git-dir=../origin.git"

    hf=$(git log -1 --format=%H --grep=''^fix: chart appVersion for 1.3.1$'' main)

    test "$(git rev-parse ''v1.3.1^{commit}'')" = "$hf"

    test "$($o rev-parse ''v1.3.1^{commit}'')" = "$hf"

    test "$(git cat-file -t v1.3.1)" = tag

    test "$($o cat-file -t v1.3.1)" = tag

    '
- type: script_passes
  description: The real releases were not touched
  script: "o=\"git --git-dir=../origin.git\"\nfor t in v1.0.0 v1.1.0 v1.2.0 v1.3.0; do\n  test \"$(git\
    \ cat-file -t $t)\" = tag\n  test \"$(git rev-parse $t)\" = \"$($o rev-parse $t)\"\ndone\n"
- type: script_passes
  description: Fetch is configured to prune branches and tags
  script: 'test "$(git config fetch.prune)" = true

    test "$(git config fetch.pruneTags)" = true'
