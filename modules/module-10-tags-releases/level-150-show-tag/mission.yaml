name: Show Tag Details
module: module-10-tags-releases
level: level-150-show-tag
order: 150
difficulty: intermediate
xp: 210
expected_time: 8m
concepts:
  - git show <tag>
  - tag metadata
  - git for-each-ref
description: |
  An auditor is reviewing the audit-log shipper and asks about release `v3.2.0`: who published it, what the release
  note said, and which exact commit the tag points to. The commit that the tag points to is **not**
  the branch tip, and the person who made the tag is not necessarily the author of the commits. Everything
  is stored in the tag object, so you do not need to ask anyone.
objective: |
  Inspect the annotated tag `v3.2.0` and record:
  1. `tagger.txt`: the name of the person who created the tag;
  2. `target.txt`: the full hash of the commit that the tag points to;
  3. `note.txt`: the first line of the tag's message.
hints:
  - "`git show` on a tag prints the tag object first (who, when, message) and then the commit it points to."
  - "To get just one field, `git for-each-ref` and `git tag --format` can print `%(taggername)`, `%(contents:subject)` and similar fields."
  - "`git rev-list -n 1 v3.2.0` resolves a tag to the commit hash. For the tagger: `git for-each-ref --format='%(taggername)' refs/tags/v3.2.0`."
guide: |
  ## Reading a tag

  Start with the human-readable view:

  ```bash
  git show v3.2.0
  ```

  The top block is the tag object: `Tagger: ...`, the date and a message. Below it comes the tagged commit. For scripting use
  the formatted outputs:

  ```bash
  git for-each-ref --format='%(taggername)' refs/tags/v3.2.0 > tagger.txt
  git tag -l v3.2.0 --format='%(contents:subject)' > note.txt
  git rev-list -n 1 v3.2.0 > target.txt
  ```

  `git rev-list -n 1 <tag>` follows the tag to its commit. `git rev-parse v3.2.0` would give the hash of the *tag object*
  instead, which is not what the auditor wants. (`git rev-parse v3.2.0^{commit}` also works.)
debrief: |
  ## What you learned

  An annotated tag is a separate object: `object <commit>`, `type commit`, `tag <name>`, `tagger <ident>` and
  a message. `git cat-file -p v3.2.0` shows the raw form. The peeled commit (`v3.2.0^{commit}`) and the tag
  object (`git rev-parse v3.2.0`) have **different hashes**, a common source of confusion in scripts.

  ## Real-world use

  Audit trails for who released what and when. For signed tags, `git tag -v <tag>` additionally verifies the signature.

  ## Pitfalls

  - `git log -1 v3.2.0` shows the commit's author, not the tagger.
  - Lightweight tags have no tagger fields, so the format placeholders come back empty.
  - The tag may point to an older commit than the one you expect (here: not `HEAD`).
common_mistakes:
  - "Writing the author of the tagged commit instead of the tagger."
  - "Using `git rev-parse v3.2.0`, which gives the hash of the tag object, not of the commit."
  - "Reading `v3.2.1` or `v3.3.0`, whose taggers and messages are different."
validators:
  - type: script_passes
    description: tagger.txt names who created v3.2.0
    script: |
      want=$(git for-each-ref --format='%(taggername)' refs/tags/v3.2.0)
      test "$want" = "Priya Nair"
      test "$(sed 's/[[:space:]]*$//' tagger.txt | sed '/^$/d')" = "$want"
  - type: script_passes
    description: target.txt is the commit hash the tag points to
    script: |
      want=$(git rev-list -n 1 v3.2.0)
      test "$(tr -d ' \r\n' < target.txt)" = "$want"
  - type: script_passes
    description: note.txt is the first line of the tag message
    script: |
      want=$(git tag -l v3.2.0 --format='%(contents:subject)')
      test "$(sed 's/[[:space:]]*$//' note.txt | sed '/^$/d')" = "$want"

