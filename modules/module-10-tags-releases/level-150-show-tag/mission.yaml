name: Show Tag Details
module: module-10-tags-releases
level: level-150-show-tag
order: 150
difficulty: intermediate
xp: 210
expected_time: 7m
concepts:
- '`git show v1.0`'
common_mistakes:
- Running commands related to `git show v1.0` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git show
  v1.0``.
objective: 'Inspect the repository history and create `show-tag.txt` containing exactly:


  `tag=v1.0`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git show v1.0``.
- Write the exact expected answer into `show-tag.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > show-tag.txt <<'EOF'\ntag=v1.0\n\
  EOF\n   ```\n\n2.\n   ```bash\n   git add show-tag.txt\n   ```\n\n3.\n   ```bash\n\
  \   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Show Tag Details**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: show-tag.txt
  text: tag=v1.0
  description: show-tag.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
