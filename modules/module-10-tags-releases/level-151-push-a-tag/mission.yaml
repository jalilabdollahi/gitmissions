name: Push a Tag
module: module-10-tags-releases
level: level-151-push-a-tag
order: 151
difficulty: intermediate
xp: 220
expected_time: 7m
concepts:
- '`git push origin v1.0`'
common_mistakes:
- Running commands related to `git push origin v1.0` without checking `git status`
  first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This module practices creating, inspecting, and publishing tags.
repo_path: local
objective: Push tag `v1.0` to `origin`.
hints:
- Start with the Git command related to ``git push origin v1.0``.
- Use `git status` often so you can see the state change.
- Leave the repository in the exact end state described by the mission.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git tag v1.0\n   ```\n\n2.\n \
  \  ```bash\n   git push origin v1.0\n   ```"
debrief: '## What Just Happened


  **Push a Tag**


  Tags mark important points in history, usually releases or audit checkpoints.

  '
validators:
- type: script_passes
  description: Remote tag exists
  script: git -C ../remote.git rev-parse --verify refs/tags/v1.0 >/dev/null
