name: List Tags
module: module-10-tags-releases
level: level-149-list-tags
order: 149
difficulty: intermediate
xp: 200
expected_time: 7m
concepts:
  - git tag -l <pattern>
  - git tag --sort=v:refname
description: |
  The open-banking connector library has accumulated many tags, some released, some release candidates, and one
  non-version tag. The release dashboard prints them alphabetically, where `v1.10.0` appears **before** `v1.2.0`, so
  nobody can tell the newest stable version. Support asks two questions: what is the latest *stable* version (no `-rc`
  suffix), and what are all tags of the 1.x line, in proper version order, so that they can be audited one by one?
objective: |
  1. Write the name of the highest stable semantic-version tag (format `vX.Y.Z`, no suffix) into `latest-stable.txt`.
  2. Write all tags that match `v1.*` (release candidates included), one per line in ascending **version** order, into `v1-tags.txt`.
hints:
  - "`git tag` sorts alphabetically. Look in `git help tag` for sorting options that understand version numbers."
  - "`--sort=v:refname` sorts ascending by version, `--sort=-v:refname` descending. `-l '<pattern>'` filters by glob."
  - "`git tag -l 'v1.*' --sort=v:refname > v1-tags.txt`. For the stable one, sort descending and filter out names with `-rc`, then take the first."
guide: |
  ## Sorting tags like a human

  See the alphabetical mess first:

  ```bash
  git tag
  ```

  Ask for version sorting:

  ```bash
  git tag --sort=-v:refname
  ```

  The first lines are `v2.0.0-rc1` (a candidate, not stable) and `v1.10.1-rc1`; the highest *stable* one is `v1.10.0`.
  Filter with grep to exclude suffixed names:

  ```bash
  git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 > latest-stable.txt
  ```

  Then list the 1.x line in ascending order:

  ```bash
  git tag -l 'v1.*' --sort=v:refname > v1-tags.txt
  cat v1-tags.txt
  ```
debrief: |
  ## What you learned

  `git tag -l <glob>` filters by pattern and `--sort=v:refname` compares dotted numbers numerically ("natural"
  version order), which is why `v1.9.0 < v1.10.0` there but not alphabetically. You can also sort by date with
  `--sort=creatordate` and print fields with `--format`. Note that `v:refname` treats `-rc1` suffixes as
  *newer* than the plain version unless you configure `versionsort.suffix=-rc`.

  ## Real-world use

  Release scripts determine "the previous tag" with exactly this pipeline. `git describe --tags --abbrev=0` gives
  the nearest tag on a branch instead, which is a different question.

  ## Pitfalls

  - Non-version tags such as `release-2024Q2` sort after numeric ones; filter them with the glob.
  - `git tag --list` output has no markers: do not confuse it with `git branch` output formatting.
  - Setting `git config versionsort.suffix -rc` makes release candidates sort before the final release.
common_mistakes:
  - "Taking the first line of the alphabetical `git tag` output, which is `release-2024Q2` or `v0.9.0`."
  - "Using `--sort=-v:refname | head -1` without excluding release candidates, which gives `v2.0.0-rc1`."
  - "Listing 1.x tags in alphabetical order, so `v1.10.0` comes before `v1.2.0`."
validators:
  - type: script_passes
    description: latest-stable.txt holds the highest stable vX.Y.Z tag
    script: |
      want=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
      test "$want" = v1.10.0
      test "$(tr -d ' \r\n' < latest-stable.txt)" = "$want"
  - type: script_passes
    description: v1-tags.txt lists v1.* tags in ascending version order
    script: |
      diff <(git tag -l 'v1.*' --sort=v:refname) <(sed 's/[[:space:]]*$//' v1-tags.txt | sed '/^$/d')
      test "$(wc -l < v1-tags.txt | tr -d ' ')" = 5

