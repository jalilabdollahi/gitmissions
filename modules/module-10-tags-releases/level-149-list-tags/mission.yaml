concepts:
- '`git tag`'
- '`git tag -l "v1.*"`'
common_mistakes:
- Running commands related to `git tag`, `git tag -l "v1.*"` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git tag`,
  `git tag -l "v1.*"``.
objective: 'Inspect the repository history and create `tags.txt` containing exactly:


  `tags=2`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git tag`, `git tag -l "v1.*"``.
- Write the exact expected answer into `tags.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > tags.txt <<'EOF'\ntags=2\n\
  EOF\n   ```\n\n2.\n   ```bash\n   git add tags.txt\n   ```\n\n3.\n   ```bash\n \
  \  git commit -m \"docs: add report\"\n   ```"
