name: Block Direct Push to Main
module: module-11-git-hooks
level: level-165-pre-push-block-main
order: 165
difficulty: advanced
xp: 380
expected_time: 12m
repo_path: work
concepts:
  - pre-push stdin protocol
  - protecting main and release branches
description: |
  The deployment manifests of the release train are applied automatically whenever `main` or a `release/*` branch changes on the
  server, so a careless `git push origin HEAD:main` goes straight to production. The platform team cannot configure branch
  protection on this self-hosted server yet, so they want a local safety net: a `pre-push` hook that refuses pushes **to** `main`
  and to any `release/*` branch on the remote, whatever your local branch is called. Pushing feature branches and tags must keep working.
objective: |
  Create an executable `.git/hooks/pre-push` that reads the pushed refs from stdin and exits 1 (with a message about opening a pull
  request) if any update targets the remote ref `refs/heads/main` or `refs/heads/release/*`. Pushes to other branches and tags must be allowed.
hints:
  - "Git feeds pre-push one line per ref on stdin: `<local ref> <local sha> <remote ref> <remote sha>`. The destination is the third field."
  - "`while read local_ref local_sha remote_ref remote_sha; do ... done` and a `case` on `$remote_ref`."
  - "Match `refs/heads/main|refs/heads/release/*`, print a message to stderr and `exit 1`; after the loop `exit 0`."
guide: |
  ## Reading what is about to be pushed

  The hook is invoked with two arguments (remote name and URL) and gets the refs on stdin. Observe it with a throwaway hook:

  ```bash
  printf '#!/bin/sh\ncat >&2\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push
  git push origin HEAD:refs/heads/feature/demo
  ```

  You will see a line such as `refs/heads/feature/scale-up <sha> refs/heads/feature/demo <sha>`. The *remote ref* matters, not the local
  branch name. Now write the real hook:

  ```bash
  cat > .git/hooks/pre-push <<'HOOK'
  #!/bin/sh
  while read local_ref local_sha remote_ref remote_sha; do
    case "$remote_ref" in
      refs/heads/main|refs/heads/release/*)
        echo "pre-push: direct pushes to ${remote_ref#refs/heads/} are blocked; open a pull request" >&2
        exit 1 ;;
    esac
  done
  exit 0
  HOOK
  chmod +x .git/hooks/pre-push
  ```

  Check `git push origin HEAD:main` is refused while `git push origin feature/scale-up` and tag pushes work.
debrief: |
  ## What you learned

  The pre-push hook sees the full list of ref updates, including the destination ref names, so it can apply policies that depend on
  *where* you push, not on what your local branch is called. `git push origin HEAD:main` from a feature branch is exactly the
  case a local-branch-name check would miss.

  ## Real-world use

  A local guard rail for protected branches, together with server-side protection (hosting settings, or the `update` /
  `pre-receive` hooks that you meet at the end of this module). The server-side rule is the real enforcement.

  ## Pitfalls

  - It protects only people who installed the hook; it is advice with a seatbelt, not security.
  - Deleting a remote branch (`git push origin :main`) also appears on stdin (local sha is all zeros); decide if you want to block it too. Here it is covered because the remote ref is checked.
  - `--no-verify` skips it.
common_mistakes:
  - "Checking the current local branch (`git branch --show-current`), which misses `git push origin HEAD:main` from a feature branch."
  - "Exiting 1 for every push, which also blocks feature branches and tags."
  - "Forgetting `release/*`, or matching `main*` which would also block `maintenance`."
  - "Reading the wrong field: the third field is the remote ref, the first is the local ref."
validators:
  - type: hook_exists
    name: pre-push
    description: an executable pre-push hook exists
  - type: script_passes
    description: pushes to main and release/* are refused, whatever the local branch is called
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      git init -q --bare -b main "$t/o.git"; git remote set-url origin "$t/o.git"
      git push -q --no-verify origin main
      before=$(git ls-remote origin refs/heads/main | cut -f1)
      must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*" >&2; exit 1; fi; }
      must_fail git push origin HEAD:refs/heads/main
      must_fail git push origin HEAD:refs/heads/release/1.0
      must_fail git push origin feature/scale-up:main
      test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$before"
      test -z "$(git ls-remote origin refs/heads/release/1.0)"
  - type: script_passes
    description: feature branches, similarly named branches and tags can still be pushed
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      git init -q --bare -b main "$t/o.git"; git remote set-url origin "$t/o.git"
      git push -q --no-verify origin main
      git push -q origin feature/scale-up
      git push -q origin HEAD:refs/heads/maintenance
      git push -q origin HEAD:refs/heads/hotfix/billing
      git tag v1.8.3
      git push -q origin v1.8.3
      test -n "$(git ls-remote origin refs/heads/feature/scale-up)"
      test -n "$(git ls-remote origin refs/tags/v1.8.3)"
      test -n "$(git ls-remote origin refs/heads/maintenance)"
