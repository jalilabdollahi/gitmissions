name: Enforce Conventional Commits
module: module-11-git-hooks
level: level-162-commit-msg-conventional
order: 162
difficulty: advanced
xp: 360
expected_time: 12m
concepts:
  - Conventional Commits
  - commit-msg with regular expressions
  - exempting merge and revert messages
description: |
  The ledger CLI team generates its changelog and version numbers from commit messages, which works only if every
  message follows the Conventional Commits format: `type(scope): subject`, where the scope in parentheses is optional and
  a `!` before the colon marks a breaking change. Allowed types are `feat`, `fix`, `docs`, `chore`, `refactor` and `test`. The
  tooling, however, produces two kinds of messages by itself, "Merge branch ..." and `Revert "..."`, and these must **not**
  be blocked, or merging a topic branch would fail.
objective: |
  Create an executable `.git/hooks/commit-msg` that accepts only subjects of the form `type(scope): subject` / `type: subject`
  (with the six types above, optional lowercase scope, optional `!`) and also lets messages starting with `Merge ` or `Revert "` through.
  Everything else must be rejected with exit status 1 and a helpful message.
hints:
  - "The subject is the first line of the message file passed as `$1`. A regular expression describes the format."
  - "`grep -Eq '^(feat|fix|docs|chore|refactor|test)(\\([a-z0-9_-]+\\))?!?: .+'` matches the format. Handle `Merge ` and `Revert \"` first with a `case`."
  - "Exit 0 early for merge/revert subjects, then `grep` the pattern; if it fails, print the expected format to stderr and `exit 1`."
guide: |
  ## Enforcing a message format

  Build the regular expression piece by piece:

  - types: `(feat|fix|docs|chore|refactor|test)`
  - optional scope: `(\([a-z0-9_-]+\))?`
  - optional breaking marker: `!?`
  - colon, a space and some text: `: .+`

  Then wrap it in a hook that lets git's own messages through:

  ```bash
  cat > .git/hooks/commit-msg <<'HOOK'
  #!/bin/sh
  subject=$(grep -v '^#' "$1" | sed -n '1p')
  case "$subject" in
    "Merge "*|"Revert \""*) exit 0 ;;
  esac
  pattern='^(feat|fix|docs|chore|refactor|test)(\([a-z0-9_-]+\))?!?: .+'
  if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
    echo "commit-msg: '$subject' does not follow Conventional Commits" >&2
    exit 1
  fi
  exit 0
  HOOK
  chmod +x .git/hooks/commit-msg
  ```

  Test with a real merge: `git merge --no-ff topic` must work with its default `Merge branch 'topic'` message, whereas
  `git commit -m "Added stuff"` must fail.
debrief: |
  ## What you learned

  A `commit-msg` hook can enforce any grammar with `grep -E`. Messages generated by git (merge, revert, squash,
  fixup) have their own shapes, so a strict rule needs explicit exceptions. Conventional Commits power automatic changelogs, semantic version
  bumps (feat = minor, fix = patch, `!` = major) and release notes.

  ## Real-world use

  Teams pair the local hook with a CI check on pull request titles, because the hook can be bypassed. Tools like `commitlint`
  provide richer rules and run as the same hook.

  ## Pitfalls

  - `fixup!` and `squash!` messages from `git commit --fixup` do not match the pattern; add exceptions if you use autosquash.
  - A rejected `commit -m` leaves the index untouched; with an editor the typed message is saved in `.git/COMMIT_EDITMSG`.
  - Scopes with uppercase or spaces fail the pattern; choose and document the rules.
common_mistakes:
  - "Forgetting to exempt `Merge branch ...`, so `git merge --no-ff` fails."
  - "Anchoring the pattern at the end with `$` after `.+`, which is harmless, but forgetting `^`, which accepts messages containing `fix:` anywhere."
  - "Making the scope mandatory or allowing uppercase types such as `Feat:`."
  - "Exiting 0 after printing the error."
validators:
  - type: hook_exists
    name: commit-msg
    description: an executable commit-msg hook exists
  - type: script_passes
    description: well-formed messages (with and without scope or breaking marker) are accepted
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      i=0
      for m in "feat: add export command" "fix(cli): handle empty ledger" "refactor(core)!: drop python 3.8" "docs: update usage" "chore(deps): bump click" "test(cli): cover balance"; do
        i=$((i+1)); printf 'line %s\n' "$i" >> cli/USAGE.txt
        git add -A; git commit -q -m "$m"
      done
      test "$(git log -1 --format=%s)" = "test(cli): cover balance"
  - type: script_passes
    description: malformed messages are rejected
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*" >&2; exit 1; fi; }
      printf 'x\n' >> cli/USAGE.txt; git add -A
      for m in "Added balance command" "feat add balance" "Feat: capital letter" "feature: wrong type" "fix(Cli): uppercase scope" "fix:no space" "fix: " "style: unknown type"; do
        must_fail git commit -q -m "$m"
      done
  - type: script_passes
    description: git's own merge and revert messages are not blocked
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      git config user.name T; git config user.email t@example.dev
      printf 'v2\n' >> cli/USAGE.txt; git add -A; git commit -q -m "docs: note v2"
      git merge -q --no-ff topic
      git log -1 --format=%s | grep -q '^Merge'
      git revert --no-edit HEAD~1 >/dev/null 2>&1 || git revert --no-edit -m 1 HEAD >/dev/null
      git log -1 --format=%s | grep -q '^Revert'

