name: Basic Pre-Commit Hook
module: module-11-git-hooks
level: level-157-pre-commit-basic
order: 157
difficulty: advanced
xp: 320
expected_time: 10m
concepts:
  - pre-commit hook
  - blocking a commit with a non-zero exit
  - git diff --cached --name-only
description: |
  The payment gateway client reads its API key from the environment. Developers keep the real values in local `*.env`
  files such as `prod.env` or `config/live.env`, and last quarter one of them was pushed to a public mirror. The security lead
  wants a hard stop at the source: git itself must refuse a commit that contains a file whose name ends in `.env`.
  Example files such as `config/env.example` are fine.
objective: |
  Write an executable `.git/hooks/pre-commit` that **rejects** (exit status 1, with a message naming the file) any commit
  in which a file ending in `.env` is staged, anywhere in the tree, including a file named just `.env`, and allows all other commits.
hints:
  - "The hook decides with its exit status. You need the list of staged paths and a pattern match."
  - "`git diff --cached --name-only` prints staged paths; `grep -E '\\.env$'` selects those that end in `.env`."
  - "If grep finds something, print the names to stderr and `exit 1`; otherwise `exit 0`. Remember `chmod +x`."
guide: |
  ## A gatekeeper

  Create the hook:

  ```bash
  cat > .git/hooks/pre-commit <<'HOOK'
  #!/bin/sh
  bad=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '\.env$' || true)
  if [ -n "$bad" ]; then
    echo "pre-commit: refusing to commit environment files:" >&2
    echo "$bad" | sed 's/^/  /' >&2
    exit 1
  fi
  exit 0
  HOOK
  chmod +x .git/hooks/pre-commit
  ```

  `|| true` keeps `grep` (which returns 1 when nothing matches) from being a problem if you later add `set -e`. Test both outcomes:

  ```bash
  echo KEY=abc > prod.env && git add -f prod.env
  git commit -m "oops"          # rejected, names prod.env
  git restore --staged prod.env && rm prod.env
  ```

  And a normal commit must still work.
debrief: |
  ## What you learned

  A pre-commit hook gates a commit with its exit code. Everything it needs is in the index, so ask git
  (`git diff --cached`) rather than looking at the working directory: the *staged* content is what will be committed.
  Messages should go to stderr and say what to do next.

  ## Real-world use

  Secret scanners (gitleaks, detect-secrets) are pre-commit hooks with much better patterns. A hook is a first line of
  defence; the same check should run on the server/CI too, because hooks can be bypassed.

  ## Pitfalls

  - `.gitignore` is the first defence against `.env` files; the hook protects against `git add -f` and a missing ignore rule.
  - Name patterns miss secrets in other files; add content scanning for serious protection.
  - Hooks are local and optional for each developer.
common_mistakes:
  - "Matching on `*.env*`, which also blocks the harmless `config/env.example`."
  - "Only checking the repository root, so `config/live.env` slips through."
  - "Printing the error but exiting 0, which lets the commit go through."
  - "Forgetting to make the hook executable."
validators:
  - type: hook_exists
    name: pre-commit
    description: an executable pre-commit hook exists
  - type: script_passes
    description: commits with .env files (root, nested or bare .env) are rejected and the file is named
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*" >&2; exit 1; fi; }
      printf 'KEY=1\n' > prod.env; git add -f prod.env
      must_fail git commit -q -m "add prod env"
      out=$(git commit -q -m "add prod env" 2>&1 || true)
      printf '%s' "$out" | grep -q 'prod.env'
      git reset -q; rm prod.env
      printf 'KEY=2\n' > config/live.env; git add -f config/live.env
      must_fail git commit -q -m "add live env"
      git reset -q; rm config/live.env
      printf 'KEY=3\n' > .env; git add -f .env
      must_fail git commit -q -m "add dotenv"
  - type: script_passes
    description: ordinary commits, including config/env.example, still succeed
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      printf 'GATEWAY_TIMEOUT=30\n' >> config/env.example
      printf 'TIMEOUT = 30\n' >> gateway/settings.py
      git add -A
      git commit -q -m "Document the gateway timeout"
      test "$(git log -1 --format=%s)" = "Document the gateway timeout"

