name: Bypass a Hook
module: module-11-git-hooks
level: level-171-bypass-a-hook
order: 171
difficulty: advanced
xp: 320
expected_time: 12m
concepts:
- "`git commit --no-verify` \u2014 when and why"
common_mistakes:
- "Running commands related to `git commit --no-verify` \u2014 when and why without\
  \ checking `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: "This repository contains a small history designed to practice ``git\
  \ commit --no-verify` \u2014 when and why`."
objective: 'Inspect the repository history and create `hooks-report.txt` containing
  exactly:


  `hook=understood`


  Then commit the report with the message `docs: add report`.'
hints:
- "Start with the Git command related to ``git commit --no-verify` \u2014 when and\
  \ why`."
- Write the exact expected answer into `hooks-report.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > hooks-report.txt <<'EOF'\n\
  hook=understood\nEOF\n   ```\n\n2.\n   ```bash\n   git add hooks-report.txt\n  \
  \ ```\n\n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Bypass a Hook**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: hooks-report.txt
  text: hook=understood
  description: hooks-report.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
