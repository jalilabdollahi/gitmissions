name: Post-Commit Notification
module: module-11-git-hooks
level: level-166-post-commit-notify
order: 166
difficulty: advanced
xp: 320
expected_time: 10m
concepts:
  - post-commit hook
  - hooks cannot block a commit that already happened
  - git log -1 --format
description: |
  Finance managers want to be told whenever an invoice approval is committed, without anybody remembering to send an email. The
  company's chat bot reads a plain-text notification file, and each commit should add one line to it. A `post-commit` hook runs
  right after a commit has been created, so it is the right tool: it cannot change or veto the commit, it can only react to it. For this
  exercise the "notification channel" is the file `.git/notifications.log`.
objective: |
  Create an executable `.git/hooks/post-commit` that appends exactly one line to `.git/notifications.log` after every
  commit, in the form `<abbreviated hash> <author name>: <subject>` (for example `a1b2c3d Carla Gomez: Approve INV-5002`), and always exits 0.
hints:
  - "`post-commit` runs after the commit exists, so you can read it back with `git log`."
  - "`git log -1 --format=...` can print the abbreviated hash (`%h`), author name (`%an`) and subject (`%s`) of the newest commit."
  - "`git log -1 --format='%h %an: %s' >> .git/notifications.log`, then `chmod +x`."
guide: |
  ## React after the fact

  Check what the new commit looks like in the format you need:

  ```bash
  git log -1 --format='%h %an: %s'
  ```

  Make a hook out of it:

  ```bash
  cat > .git/hooks/post-commit <<'HOOK'
  #!/bin/sh
  git log -1 --format='%h %an: %s' >> "$(git rev-parse --git-dir)/notifications.log"
  exit 0
  HOOK
  chmod +x .git/hooks/post-commit
  ```

  Test it:

  ```bash
  echo "INV-5002,carla,approved" >> approvals/queue.csv
  git commit -am "Approve INV-5002"
  cat .git/notifications.log
  ```

  Every commit adds one line. Notice that a failure inside a post-commit hook would **not** undo the commit.
debrief: |
  ## What you learned

  `post-commit` runs after the commit object has been created and HEAD updated. It takes no arguments and its exit status is ignored, so it is for
  notifications, logging and cache refreshes, never for enforcement. `git log -1 --format=...` with placeholders is how a hook
  describes the commit that just happened. `git rev-parse --git-dir` locates the git directory robustly, also in worktrees.

  ## Real-world use

  Posting to chat, triggering a local build or updating a status badge. Keep post-commit hooks **fast** and quiet, as they run on every commit
  (including rebases that create commits, which can be a lot of them).

  ## Pitfalls

  - Do not use post-commit for checks that must block something: by the time it runs, the commit is already in the repository.
  - A slow or network-dependent hook makes every commit feel sluggish; background it or use `post-receive` on the server.
  - Amends and rebase-picks may or may not trigger it; test the situations that matter.
common_mistakes:
  - "Writing a `pre-commit` hook, which runs before the commit and cannot know its hash."
  - "Using `git log` without `-1` and appending the entire history on every commit."
  - "Using `%an` as `%cn` or forgetting the colon after the author name."
  - "Printing to stdout instead of appending to the log file."
validators:
  - type: hook_exists
    name: post-commit
    description: an executable post-commit hook exists
  - type: script_passes
    description: a commit by another author appends exactly one correctly formatted line
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      before=$(cat .git/notifications.log 2>/dev/null | wc -l | tr -d ' ')
      printf 'INV-5002,carla,approved\n' >> approvals/queue.csv
      GIT_AUTHOR_NAME="Carla Gomez" GIT_AUTHOR_EMAIL=carla@example.dev git commit -q -am "Approve INV-5002"
      after=$(wc -l < .git/notifications.log | tr -d ' ')
      test "$after" = "$((before+1))"
      test "$(tail -1 .git/notifications.log)" = "$(git log -1 --format='%h %an: %s')"
      tail -1 .git/notifications.log | grep -q ' Carla Gomez: Approve INV-5002$'
  - type: script_passes
    description: every further commit adds its own line, in order
    script: |
      t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
      cp -R . "$t/r"; cd "$t/r"; git config core.hooksPath .git/hooks
      rm -f .git/notifications.log
      printf 'a\n' >> approvals/limits.yaml; git commit -q -am "Raise the first threshold"
      printf 'b\n' >> approvals/limits.yaml; git commit -q -am "Raise the second threshold"
      test "$(wc -l < .git/notifications.log | tr -d ' ')" = 2
      test "$(sed -n 1p .git/notifications.log | cut -d' ' -f1)" = "$(git log -1 --format=%h HEAD~1)"
      tail -1 .git/notifications.log | grep -q 'Raise the second threshold$'

