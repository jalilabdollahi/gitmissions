name: Pop the Stash
module: module-07-stash
level: level-108-stash-pop
order: 108
difficulty: intermediate
xp: 200
expected_time: 8m
concepts:
  - git stash pop
  - returning to a branch
  - finishing stashed work
repo_path: cardloop
description: |
  Cardloop is a flashcards app. Two days ago you stashed your half-written shuffle mode while on
  `feature/shuffle` to ship a quick typo fix on `main`. The fix is done, so now you can come back. Go back to
  the feature branch, restore the stashed work (so that the stash list is empty again), and finish
  the feature with a commit.
objective: |
  - switch to `feature/shuffle` and restore the stashed changes with `git stash pop`
  - commit the restored work with the message `Add shuffle mode`
  - the stash list must be empty afterwards and the working tree clean
hints:
  - "`git stash list` shows what is stored. The entry remembers which branch it came from, but Git will apply it to wherever you are."
  - "Switch to the feature branch first, then `git stash pop`: it applies the changes and removes the entry in one step."
  - "`git switch feature/shuffle && git stash pop && git commit -am \"Add shuffle mode\"`"
guide: |
  ## 1. Look at the stack
  ```bash
  git stash list
  git branch
  ```
  The entry says `On feature/shuffle: WIP shuffle implementation`.

  ## 2. Go back and restore
  ```bash
  git switch feature/shuffle
  git stash pop
  git status -sb
  ```
  `pop` = `apply` + `drop`. Your edits are back in the working tree.

  ## 3. Finish
  ```bash
  git commit -am "Add shuffle mode"
  git stash list
  ```
  The list is empty again.
debrief: |
  ## What happened
  A stash is not tied to the branch it was created on. `pop` replays the saved diff on the current
  HEAD and removes the entry if it applied without conflict. Because you returned to the original
  branch, the diff applied cleanly.

  ## Pop on the wrong branch
  Popping onto a different branch can conflict or silently put changes where they do not belong.
  Check `git stash list` to see where the entry came from.

  ## If pop conflicts
  The entry is kept (not dropped) so that you do not lose it. Resolve, then `git stash drop` yourself.
  A later level covers that.

  ## Related
  - `git stash apply` keeps the entry.
  - `git stash pop stash@{1}` pops a specific entry.
common_mistakes:
  - "Popping while still on `main`, which puts the shuffle code on the wrong branch."
  - "Using `git stash apply` and leaving a stale entry behind."
  - "Forgetting to commit after the pop, so the work stays uncommitted."
validators:
  - type: is_on_branch
    branch: feature/shuffle
    description: HEAD is on feature/shuffle
  - type: stash_empty
    description: The stash list is empty
  - type: commit_message_equals
    text: Add shuffle mode
    description: The shuffle work is committed
  - type: script_passes
    script: |
      grep -q 'Math.random' shuffle.js
    description: The stashed implementation is in shuffle.js
  - type: is_clean
    description: Working tree is clean
