name: Stash Pop Conflict
module: module-07-stash
level: level-115-stash-conflict
order: 115
difficulty: intermediate
xp: 260
expected_time: 13m
concepts:
  - stash pop conflict
  - resolving and dropping the stash
  - keeping both changes
repo_path: tierprice
description: |
  In the Tierprice subscription pricing repo, you stashed a pricing edit (pro plan price lowered to 18 and a new
  `enterprise` plan at 90) and then switched to other work. Meanwhile `main` received a commit raising the pro price
  to 24. Popping the stash now collides on the pro line. Git will report the conflict and, to be safe, keep the stash
  entry. Resolve it by keeping main's new pro price (24) together with your new enterprise plan, commit the combined
  result and clean up the stash.
objective: |
  - run `git stash pop` and resolve the conflict in `pricing.yaml` so it contains both `  pro: 24` and `  enterprise: 90` (and `  team: 50`), without conflict markers
  - commit the result with the message `Add enterprise plan with new pro price`
  - make sure the stash list is empty afterwards (a conflicted pop does not drop the entry on its own)
  - leave a clean working tree
hints:
  - "After `git stash pop`, Git reports CONFLICT in `pricing.yaml`, and `git stash list` still shows the entry. That is intentional."
  - "Fix the file by hand (keep the 24 from HEAD and your enterprise line), `git add pricing.yaml`, commit, and then remove the entry yourself with `git stash drop`."
  - "`git stash pop`, edit `pricing.yaml`, `git add pricing.yaml && git commit -m \"Add enterprise plan with new pro price\" && git stash drop`"
guide: |
  ## 1. Pop and watch it fail halfway
  ```bash
  git stash pop
  git status
  git stash list
  ```
  The conflicted file is `pricing.yaml`. The stash is still listed because the pop did not fully succeed.

  ## 2. Resolve the file
  ```bash
  cat pricing.yaml
  ```
  The `<<<<<<<` part (upstream/HEAD) has `pro: 24`, the stash part has `pro: 18`. Write the final file:
  ```yaml
  plans:
    pro: 24
    team: 50
    enterprise: 90
  ```

  ## 3. Mark resolved and commit
  ```bash
  git add pricing.yaml
  git commit -m "Add enterprise plan with new pro price"
  ```

  ## 4. Drop the leftover stash
  ```bash
  git stash drop
  git stash list
  ```
debrief: |
  ## What happened
  Applying a stash is a three-way merge between the stash's base, the stash content and your current HEAD.
  The pro line changed on both sides, so Git left markers and kept the stash. After you resolved the file the
  entry was redundant, but Git never drops it automatically in the conflict case.

  ## Resolution rules
  Stash conflicts look like merge conflicts (`<<<<<<< Updated upstream` / `>>>>>>> Stashed changes`).
  Resolve, `git add` (or `git restore --staged` to leave them unstaged), then drop the entry yourself.

  ## Avoiding it
  Apply stashes soon, or promote them to branches with `git stash branch` (see the previous level) so
  conflicts become ordinary merges.

  ## Related
  - `git stash apply` does the same but never drops.
  - `git checkout --theirs/--ours` is available for whole-file choices (in a stash, "theirs" is the stash).
common_mistakes:
  - "Believing the stash is gone after the conflict and leaving a stale entry behind."
  - "Taking the stash's side completely and losing the price increase to 24 from main."
  - "Committing with conflict markers still in `pricing.yaml`."
validators:
  - type: script_passes
    script: |
      grep -qx '  pro: 24' pricing.yaml && grep -qx '  enterprise: 90' pricing.yaml && grep -qx '  team: 50' pricing.yaml
    description: pricing.yaml keeps main's pro price and the enterprise plan
  - type: no_conflict_markers
    description: No conflict markers remain
  - type: no_unmerged_files
    description: No unmerged files remain
  - type: commit_message_equals
    text: Add enterprise plan with new pro price
    description: The combined result is committed
  - type: stash_empty
    description: The stash list is empty
  - type: is_clean
    description: Working tree is clean
