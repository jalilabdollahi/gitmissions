name: Multiple Stashes
module: module-07-stash
level: level-110-multiple-stashes
order: 110
difficulty: intermediate
xp: 230
expected_time: 7m
concepts:
- '`git stash list`'
- '`git stash apply stash@{2}`'
common_mistakes:
- Running commands related to `git stash list`, `git stash apply stash@{2}` without
  checking `git status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This level starts with work in progress that should be managed through
  Git stash.
objective: Apply the older stash so `app.txt` ends with `first`.
hints:
- Start with the Git command related to ``git stash list`, `git stash apply stash@{2}``.
- Use `git status` often so you can see the state change.
- Leave the repository in the exact end state described by the mission.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git stash apply stash@{1}\n  \
  \ ```"
debrief: '## What Just Happened


  **Multiple Stashes**


  Stash is a useful side shelf for changes you are not ready to commit.

  '
validators:
- type: file_content_equals
  path: app.txt
  text: first
  description: The older stash was applied
