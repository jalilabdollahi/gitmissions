name: Apply Without Removing
module: module-07-stash
level: level-109-stash-apply
order: 109
difficulty: intermediate
xp: 210
expected_time: 7m
concepts:
- '`git stash apply`'
common_mistakes:
- Running commands related to `git stash apply` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This level starts with work in progress that should be managed through
  Git stash.
objective: Apply the stash without removing it from the stash list.
hints:
- Start with the Git command related to ``git stash apply``.
- Use `git status` often so you can see the state change.
- Leave the repository in the exact end state described by the mission.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git stash apply\n   ```"
debrief: '## What Just Happened


  **Apply Without Removing**


  Stash is a useful side shelf for changes you are not ready to commit.

  '
validators:
- type: stash_not_empty
  description: Stash still has an entry
- type: file_content_equals
  path: app.txt
  text: stashed change
  description: app.txt contains the restored change
