level: level-202-gc
order: 202
difficulty: expert
xp: 520
expected_time: 12m
concepts:
- "`git gc` \u2014 what gets cleaned up"
common_mistakes:
- "Running commands related to `git gc` \u2014 what gets cleaned up without checking\
  \ `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: "This repository contains a small history designed to practice ``git\
  \ gc` \u2014 what gets cleaned up`."
objective: 'Inspect the repository history and create `internals.txt` containing exactly:


  `object=known`


  Then commit the report with the message `docs: add report`.'
hints:
- "Start with the Git command related to ``git gc` \u2014 what gets cleaned up`."
- Write the exact expected answer into `internals.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > internals.txt <<'EOF'\n\
  object=known\nEOF\n   ```\n\n2.\n   ```bash\n   git add internals.txt\n   ```\n\n\
  3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


