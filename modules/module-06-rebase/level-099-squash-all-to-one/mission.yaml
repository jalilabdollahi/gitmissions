name: Squash Feature to One Commit
module: module-06-rebase
level: level-099-squash-all-to-one
order: 99
difficulty: intermediate
xp: 320
expected_time: 10m
concepts:
  - squashing a whole branch
  - git reset --soft
  - one commit per feature
repo_path: giftlist
description: |
  The Giftlist wedding-registry app has a long feature branch `feature/registry-sharing` with seven small commits,
  including "wip" ones and several edits of the same file. The maintainers merge features as one commit
  titled with the pull-request number. Turn the whole branch into one commit on top of `main`, with the final
  contents exactly as they are now, titled `Add registry sharing (#412)`.
objective: |
  - `feature/registry-sharing` must have exactly one commit on top of `main`, with the message `Add registry sharing (#412)`
  - the file contents must stay as they are now: `registry.py` (final `STEP = 7`), `share.py`, `notify.py` and `test_registry.py`
  - stay on `feature/registry-sharing`; `main` must not change
hints:
  - "`git log --oneline main..feature/registry-sharing` shows seven commits. Their combined result is the tip's file content."
  - "You could mark six todo lines as squash/fixup in an interactive rebase. A shorter way is to move the branch pointer back to main while keeping all changes staged."
  - "`git reset --soft main && git commit -m \"Add registry sharing (#412)\"`"
guide: |
  ## 1. Review
  ```bash
  git log --oneline main..feature/registry-sharing
  git diff --stat main
  ```
  The second command is what the single commit must contain.

  ## 2. Move the branch back, keep the work
  ```bash
  git reset --soft main
  git status
  ```
  `--soft` moves the branch pointer only. The index still holds everything from the seven commits, ready to commit.

  ## 3. Commit once
  ```bash
  git commit -m "Add registry sharing (#412)"
  git log --oneline main..feature/registry-sharing
  ```
  An interactive rebase with `squash`/`fixup` gives the same result and lets you keep parts of the old messages.
debrief: |
  ## What happened
  `git reset --soft main` repointed the branch at main without touching the index or working tree, so
  the sum of all your changes shows up as "staged". One commit then captures it.

  ## Reset or rebase?
  Soft reset is quick when you want a brand-new message. Interactive rebase is better when some commits
  should survive or the messages should be combined.

  ## Squash-merge
  Many hosts offer "squash and merge" that does the equivalent when merging a pull request.
  Locally, `git merge --squash feature` stages the combined change on the target branch.

  ## Pitfalls
  - `reset --soft` works from a base that is an ancestor. If main moved, rebase first.
  - The old seven commits remain in the reflog if you want them back.

  ## Related
  - `git reset --mixed` (default) unstages, `--hard` also discards the working tree.
common_mistakes:
  - "Using `git reset --hard main`, which throws away all the work."
  - "Squashing only part of the branch, leaving two or three commits."
  - "Committing with the old message or without the `(#412)` suffix."
validators:
  - type: is_on_branch
    branch: feature/registry-sharing
    description: HEAD is on feature/registry-sharing
  - type: script_passes
    script: |
      test "$(git rev-list --count main..feature/registry-sharing)" = 1 && git merge-base --is-ancestor main HEAD
    description: Exactly one commit sits on top of main
  - type: commit_message_equals
    text: "Add registry sharing (#412)"
    description: The commit message matches
  - type: script_passes
    script: |
      grep -qx 'STEP = 7' registry.py && test -f share.py && test -f notify.py && test -f test_registry.py
    description: All files are present with their final contents
  - type: is_clean
    description: Working tree is clean
