name: Edit a Commit Mid-Rebase
module: module-06-rebase
level: level-097-interactive-edit
order: 97
difficulty: intermediate
xp: 320
expected_time: 12m
concepts:
- "`edit` / `e` \u2014 amend a commit in history"
common_mistakes:
- "Running commands related to `edit` / `e` \u2014 amend a commit in history without\
  \ checking `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: The latest feature commit message should be rewritten to something cleaner.
objective: 'Change the latest commit message to `feat: polished commit`.'
hints:
- '`git commit --amend -m ...` works for the latest commit.'
- Interactive rebase is another valid option.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git commit --amend -m \"feat:\
  \ polished commit\"\n   ```"
debrief: '## What Just Happened


  **Edit a Commit Mid-Rebase**


  Rewording improves commit history without changing the snapshot itself.

  '
validators:
- type: commit_message_contains
  text: 'feat: polished commit'
  description: Latest commit message is correct
- type: is_clean
  description: Working tree is clean
