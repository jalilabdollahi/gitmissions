name: Abort a Rebase
module: module-06-rebase
level: level-090-abort-rebase
order: 90
difficulty: intermediate
xp: 260
expected_time: 12m
concepts:
- '`git rebase --abort`'
common_mistakes:
- Running commands related to `git rebase --abort` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: A rebase is already in progress and paused on a conflict.
objective: Abort the rebase and return to the original branch state.
hints:
- Git leaves state files during an in-progress rebase.
- Use `git rebase --abort`.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git rebase --abort\n   ```"
debrief: '## What Just Happened


  **Abort a Rebase**


  Aborting a rebase is the fastest way back when you decide not to continue rewriting
  history.

  '
validators:
- type: is_on_branch
  branch: feature/rebase
  description: HEAD is back on feature/rebase
- type: is_clean
  description: Working tree is clean
