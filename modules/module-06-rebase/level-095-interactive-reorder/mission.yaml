name: Reorder Commits
module: module-06-rebase
level: level-095-interactive-reorder
order: 95
difficulty: intermediate
xp: 300
expected_time: 11m
concepts:
  - reordering commits
  - interactive rebase
  - commits that build independently
repo_path: profilr
description: |
  The Profilr user-profile service gets avatar uploads. On `feature/avatars` you committed the endpoint first
  (`Add avatar upload endpoint`, which writes to the `avatars` table), then the database migration that
  creates that table, then thumbnails. A reviewer checked out the endpoint commit alone and it
  crashed because the table did not exist yet. Every commit should work on its own, so the migration has to come first.
objective: |
  - reorder the commits of `feature/avatars` so the order from oldest to newest is: `Create avatars table migration`, `Add avatar upload endpoint`, `Add avatar thumbnails`
  - no commit may be lost or altered, and every commit that contains `api/avatar.py` must also contain `db/002_avatars.sql`
  - finish on `feature/avatars` with no rebase in progress
hints:
  - "`git log --oneline --reverse main..feature/avatars` shows the current order: endpoint, migration, thumbnails."
  - "Interactive rebase lets you move todo lines. The list is oldest first, so swap the first two lines."
  - "`git rebase -i main`, move the `Create avatars table migration` line above the `Add avatar upload endpoint` line."
guide: |
  ## 1. Current order
  ```bash
  git log --oneline --reverse main..feature/avatars
  ```

  ## 2. Open the todo
  ```bash
  git rebase -i main
  ```
  ```
  pick aaa Add avatar upload endpoint
  pick bbb Create avatars table migration
  pick ccc Add avatar thumbnails
  ```

  ## 3. Swap the first two lines
  ```
  pick bbb Create avatars table migration
  pick aaa Add avatar upload endpoint
  pick ccc Add avatar thumbnails
  ```
  Save and close. The commits touch different files, so there is nothing to resolve.

  ## 4. Verify each commit
  ```bash
  git show --stat HEAD~2 HEAD~1 HEAD
  ```
debrief: |
  ## What happened
  The interactive todo is simply an ordered replay script. Moving a line changes the order in which commits
  are replayed. Since the commits modify different files, they apply in any order without conflicts.

  ## Why order matters
  A history where every commit builds and passes tests allows `git bisect` to work and reverts to be
  safe. A migration should precede the code that depends on it.

  ## When reordering conflicts
  If two commits touch the same lines, swapping them produces conflicts that you resolve like any rebase
  conflict. Moving a commit across dependent changes is where history editing gets risky.

  ## Related
  - `git rebase -i --exec "make test"` checks every rewritten commit (see the exec level).
  - `git cherry-pick` can rebuild the order by hand.
common_mistakes:
  - "Reading the todo list newest-first and swapping the wrong pair."
  - "Deleting a line to move it and forgetting to paste it back, which drops the commit."
  - "Putting the migration after the thumbnails, which still leaves the endpoint commit before it."
validators:
  - type: is_on_branch
    branch: feature/avatars
    description: HEAD is on feature/avatars
  - type: script_passes
    script: |
      test "$(git log --reverse --format=%s main..feature/avatars | tr '\n' '|')" = "Create avatars table migration|Add avatar upload endpoint|Add avatar thumbnails|"
    description: The commits are in the dependency-friendly order
  - type: script_passes
    script: |
      for c in $(git rev-list main..feature/avatars); do
        if git cat-file -e "$c:api/avatar.py" 2>/dev/null; then git cat-file -e "$c:db/002_avatars.sql"; fi
      done
    description: Every commit with the endpoint also has the migration
  - type: script_passes
    script: "! test -d .git/rebase-merge && test -f api/thumbs.py"
    description: No rebase in progress and no work was lost
