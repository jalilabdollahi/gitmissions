name: Revert Without Committing
module: module-09-reset-revert
level: level-136-revert-no-commit
order: 136
difficulty: advanced
xp: 320
expected_time: 8m
concepts:
  - git revert --no-commit
  - reverting several commits as one
description: |
  The invoice engine's finance owner has decided to scrap the loyalty and seasonal discount experiments before
  they reach customers, but she wants the rollback to be **one single, reviewable commit** in the history rather than two. In
  between, a colleague added a billing contact to the invoice footer, which has to stay. All of this is already on
  the shared `main`, so rewriting history is not allowed.
objective: |
  Add exactly **one** new commit on top of the current tip, with the message `Roll back discount experiments`, that
  removes both discount modules (`discounts/loyalty.py` and `discounts/seasonal.py`). The footer change
  must remain, and no existing commit may be rewritten or removed.
hints:
  - "A plain `git revert` creates one commit per reverted commit. There is a flag that applies the inverse change but lets you decide when to commit."
  - "`git revert --no-commit` (or `-n`) stages the result and stops. You can give it several commits."
  - "`git revert --no-commit HEAD~1 HEAD~2`, then `git commit -m \"Roll back discount experiments\"`."
guide: |
  ## Two reverts, one commit

  Find the two commits and check the order:

  ```bash
  git log --oneline
  ```

  Revert both, but do not let git commit after each one:

  ```bash
  git revert --no-commit HEAD~1 HEAD~2
  git status
  ```

  Both discount files show up as staged deletions and `footer.txt` is untouched. Take a look:

  ```bash
  git diff --cached --stat
  ```

  Create the single rollback commit yourself:

  ```bash
  git commit -m "Roll back discount experiments"
  git log --oneline
  ```
  If something looks wrong before committing, `git revert --abort` cancels the whole operation.
debrief: |
  ## What you learned

  `git revert -n` (`--no-commit`) applies the inverse of the given commits to your working tree and index
  and leaves the commit to you. That lets you combine several reverts into one commit, adjust files
  before committing, or revert and then fix up the result.

  ## Real-world use

  A feature that shipped in several commits is withdrawn in one reviewable "Revert feature X" commit; this is much
  easier to cherry-pick onto release branches than a stack of reverts.

  ## Pitfalls

  - When reverting several commits give them **newest first**, because later commits may depend on earlier ones.
  - A conflicted `--no-commit` revert leaves you in the middle of a sequencer operation; finish with `git revert --continue` or cancel with `--abort`.
  - A range works too: `git revert -n HEAD~2..HEAD~1`.
common_mistakes:
  - "Running two plain `git revert` commands, which creates two commits and fails the 'exactly one new commit' requirement."
  - "Reverting HEAD, the footer commit, because it is the newest."
  - "Resetting to before the experiments, which erases the footer change and rewrites shared history."
validators:
  - type: script_passes
    description: exactly one new commit with the requested message sits on top of the previous tip
    script: |
      test "$(git rev-parse HEAD~1)" = "$(cat .git/gm-tip)"
      test "$(git log -1 --format=%s)" = "Roll back discount experiments"
      test "$(git rev-list --count HEAD)" = 5
  - type: script_passes
    description: both discount modules are gone but the footer change stays
    script: |
      test ! -e discounts/loyalty.py
      test ! -e discounts/seasonal.py
      grep -q 'billing@example.dev' footer.txt
  - type: script_passes
    description: the experiment commits are still in history (revert, not reset) and the tree is clean
    script: |
      git log --format=%s | grep -qx 'Add loyalty discount experiment'
      git log --format=%s | grep -qx 'Add seasonal discount experiment'
      test -z "$(git status --porcelain)"

