name: Restore File to Version
module: module-09-reset-revert
level: level-139-restore-file
order: 139
difficulty: advanced
xp: 300
expected_time: 10m
concepts:
- '`git restore -s <hash> -- <file>`'
common_mistakes:
- Running commands related to `git restore -s <hash> -- <file>` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: A file should be restored from an older commit without resetting the
  whole branch.
objective: Restore `config.txt` from `HEAD~1` so it contains `stable`.
hints:
- Use `git restore -s HEAD~1 -- config.txt` or checkout syntax.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git restore -s HEAD~1 -- config.txt\n\
  \   ```"
debrief: '## What Just Happened


  **Restore File to Version**


  File-level restore is a precise rollback tool for single paths.

  '
validators:
- type: file_content_equals
  path: config.txt
  text: stable
  description: config.txt was restored
