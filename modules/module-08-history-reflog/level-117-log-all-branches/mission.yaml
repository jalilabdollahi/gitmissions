name: Log All Branches
module: module-08-history-reflog
level: level-117-log-all-branches
order: 117
difficulty: advanced
xp: 280
expected_time: 10m
concepts:
- "`--all` flag \u2014 see the full picture"
common_mistakes:
- "Running commands related to `--all` flag \u2014 see the full picture without checking\
  \ `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: "This repository contains a small history designed to practice ``--all`\
  \ flag \u2014 see the full picture`."
objective: 'Inspect the repository history and create `all-branches.txt` containing
  exactly:


  `subjects=4`


  Then commit the report with the message `docs: add report`.'
hints:
- "Start with the Git command related to ``--all` flag \u2014 see the full picture`."
- Write the exact expected answer into `all-branches.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > all-branches.txt <<'EOF'\n\
  subjects=4\nEOF\n   ```\n\n2.\n   ```bash\n   git add all-branches.txt\n   ```\n\
  \n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Log All Branches**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: all-branches.txt
  text: subjects=4
  description: all-branches.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
