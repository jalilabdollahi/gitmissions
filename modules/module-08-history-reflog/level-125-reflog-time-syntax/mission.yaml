name: Reflog Time Syntax
module: module-08-history-reflog
level: level-125-reflog-time-syntax
order: 125
difficulty: advanced
xp: 300
expected_time: 10m
concepts:
- '`HEAD@{2.hours.ago}`'
- '`HEAD@{yesterday}`'
common_mistakes:
- Running commands related to `HEAD@{2.hours.ago}`, `HEAD@{yesterday}` without checking
  `git status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``HEAD@{2.hours.ago}`,
  `HEAD@{yesterday}``.
objective: 'Inspect the repository history and create `time-syntax.txt` containing
  exactly:


  `supported=yes`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``HEAD@{2.hours.ago}`, `HEAD@{yesterday}``.
- Write the exact expected answer into `time-syntax.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > time-syntax.txt <<'EOF'\n\
  supported=yes\nEOF\n   ```\n\n2.\n   ```bash\n   git add time-syntax.txt\n   ```\n\
  \n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **Reflog Time Syntax**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: time-syntax.txt
  text: supported=yes
  description: time-syntax.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
