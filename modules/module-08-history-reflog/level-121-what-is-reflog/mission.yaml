name: What Is Reflog?
module: module-08-history-reflog
level: level-121-what-is-reflog
order: 121
difficulty: advanced
xp: 300
expected_time: 10m
concepts:
- "`git reflog` \u2014 the safety net"
common_mistakes:
- "Running commands related to `git reflog` \u2014 the safety net without checking\
  \ `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: "This repository contains a small history designed to practice ``git\
  \ reflog` \u2014 the safety net`."
objective: 'Inspect the repository history and create `reflog.txt` containing exactly:


  `entries>=3`


  Then commit the report with the message `docs: add report`.'
hints:
- "Start with the Git command related to ``git reflog` \u2014 the safety net`."
- Write the exact expected answer into `reflog.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > reflog.txt <<'EOF'\nentries>=3\n\
  EOF\n   ```\n\n2.\n   ```bash\n   git add reflog.txt\n   ```\n\n3.\n   ```bash\n\
  \   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **What Is Reflog?**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: reflog.txt
  text: entries>=3
  description: reflog.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
