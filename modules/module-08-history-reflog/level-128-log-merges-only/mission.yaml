name: Show Only Merge Commits
module: module-08-history-reflog
level: level-128-log-merges-only
order: 128
difficulty: advanced
xp: 280
expected_time: 8m
concepts:
  - git log --merges
  - filtering history by parent count
description: |
  The crowdfunding open-data ledger is built from pull requests. The maintainers want a quick audit of
  *integration points*: which merges were made into `main`, ignoring all the individual work commits. One of
  the contributors also merged `main` into her own branch before opening the pull request, and that merge
  counts as well, because it is a merge commit that is part of the history.
objective: |
  Create `merge-report.txt` containing the **subject line of every merge commit** in the history of `main`,
  one per line, and nothing else (no work commits, no hashes).
hints:
  - "A merge commit is a commit with more than one parent. `git log` can show only those."
  - "Look for a `git log` option that selects merge commits, and a `--format` that prints only the subject."
  - "`git log --merges --format=%s > merge-report.txt`"
guide: |
  ## Only the merges

  The normal log mixes work commits and merges:

  ```bash
  git log --oneline --graph
  ```

  `--merges` keeps commits with two or more parents:

  ```bash
  git log --merges --oneline
  ```

  You should see four merges: three pull requests and one "Merge branch 'main' into ..." made by Grace on her own branch.
  Print only the subject lines and save them:

  ```bash
  git log --merges --format=%s > merge-report.txt
  cat merge-report.txt
  ```

  Tip: `git log --merges --first-parent` would show only merges *into* main, skipping Grace's internal merge. The
  task asked for every merge, so do not use it here.
debrief: |
  ## What you learned

  `--merges` is shorthand for `--min-parents=2`; `--no-merges` is `--max-parents=1`. Selecting by the shape of
  the DAG, not the content, is a cheap way to see how a team integrates work: how often, by whom and with
  what message convention.

  ## Real-world use

  Release notes for pull-request based teams are often just the list of merge subjects, and incident reviews start by
  asking "which merges happened between the last good deploy and the first bad one?"
  (`git log --merges v1.0..main`).

  ## Pitfalls

  - Fast-forward merges leave **no** merge commit, so they are invisible here. `--no-ff` forces one.
  - Squash merges produce a normal one-parent commit and also do not appear.
  - `--first-parent` follows only the main line and is different from `--merges`.
common_mistakes:
  - "Using `--first-parent` and missing the merge of main into Grace's branch."
  - "Writing `git log --oneline --merges`, which puts abbreviated hashes at the start of every line."
  - "Using `--no-merges` by mistake, which lists the opposite set."
validators:
  - type: script_passes
    description: merge-report.txt lists exactly the merge commit subjects (4 lines)
    script: |
      test -f merge-report.txt
      diff <(git log --merges --format=%s | sort) <(sed 's/[[:space:]]*$//' merge-report.txt | sed '/^$/d' | sort)
      test "$(sed '/^[[:space:]]*$/d' merge-report.txt | wc -l | tr -d ' ')" = 4
  - type: script_passes
    description: the report does not contain hashes or work commits
    script: |
      ! grep -q 'Export campaigns' merge-report.txt
      ! grep -Eq '^[0-9a-f]{7,40} ' merge-report.txt

