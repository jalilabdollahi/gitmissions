name: File Change History
module: module-08-history-reflog
level: level-118-log-file-history
order: 118
difficulty: advanced
xp: 290
expected_time: 10m
concepts:
- '`git log -- <file>`'
- '`git log -p <file>`'
common_mistakes:
- Running commands related to `git log -- <file>`, `git log -p <file>` without checking
  `git status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repository contains a small history designed to practice ``git log
  -- <file>`, `git log -p <file>``.
objective: 'Inspect the repository history and create `file-history.txt` containing
  exactly:


  `app_changes=2`


  Then commit the report with the message `docs: add report`.'
hints:
- Start with the Git command related to ``git log -- <file>`, `git log -p <file>``.
- Write the exact expected answer into `file-history.txt`.
- Commit the report so the working tree ends clean.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > file-history.txt <<'EOF'\n\
  app_changes=2\nEOF\n   ```\n\n2.\n   ```bash\n   git add file-history.txt\n   ```\n\
  \n3.\n   ```bash\n   git commit -m \"docs: add report\"\n   ```"
debrief: '## What Just Happened


  **File Change History**


  Inspection commands become much easier to remember when you tie them to concrete
  answers.

  '
validators:
- type: file_content_equals
  path: file-history.txt
  text: app_changes=2
  description: file-history.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: add report'
  description: 'Latest commit message contains ''docs: add report'''
- type: is_clean
  description: Working tree is clean
