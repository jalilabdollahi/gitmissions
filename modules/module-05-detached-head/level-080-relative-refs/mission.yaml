objective: Check out `HEAD~1` so that HEAD becomes detached.
hints:
- A detached HEAD happens when HEAD points directly to a commit or tag.
- Use `git checkout HEAD~1`.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git checkout HEAD~1\n   ```"
