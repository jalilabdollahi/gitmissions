name: Keep Their Version
module: module-03-merge-conflicts
level: level-041-keep-theirs
order: 41
difficulty: intermediate
xp: 220
expected_time: 10m
concepts:
  - git checkout --theirs <file>
  - choosing a side per file
description: |
  A tourist-information app has German UI strings in `lang/de.json`. Liam shortened some strings with machine
  translation on `main`, while Eva, a native speaker, reviewed all of them on `german-review`. Eva's text is the
  authoritative translation, so wherever the two differ her file should win. Unfortunately her branch also pointed
  `app.ini` to a staging API server for testing, which must not reach production: for that file `main`'s version
  is the correct one. Both files conflict.
objective: |
  Merge `german-review` into `main`. Resolve `lang/de.json` by taking Eva's complete file and `app.ini` by keeping
  the version from `main`. The merge must be committed, there must be no markers, and `git status` must be clean.
hints:
  - "`git status` lists two conflicted files, and they need opposite decisions."
  - "During a merge, `ours` is the branch you are on and `theirs` is the branch you are merging in. `git checkout --ours|--theirs <file>` picks a whole file from one side."
  - "`git checkout --theirs lang/de.json`, `git checkout --ours app.ini`, then `git add` both files and `git commit`."
guide: |
  ## 1. Merge
  ```bash
  git merge german-review
  git status
  ```
  `lang/de.json` and `app.ini` are both "both modified".

  ## 2. Decide per file
  - `lang/de.json`: the reviewer is authoritative, so take theirs.
  - `app.ini`: production configuration lives on `main`, so keep ours.
  ```bash
  git checkout --theirs lang/de.json
  git checkout --ours app.ini
  ```

  ## 3. Verify and commit
  ```bash
  grep staging app.ini        # should print nothing
  git add lang/de.json app.ini
  git commit -m "Merge german-review: native strings, production API"
  ```
debrief: |
  ## What happened
  For each conflicted path Git holds three stages in the index: 1 = base, 2 = ours, 3 = theirs. The checkout options
  copy stage 2 or stage 3 into the working tree. You chose a different side for each file, so the result contains
  Eva's translation but none of her testing configuration.

  ## Why it matters
  Often the question is not "which lines" but "who is authoritative for this file". A branch can contain both
  desired content and unwanted side effects, which is why reviewing the commit's other changes matters.

  ## Related
  - `git show :2:app.ini` and `git show :3:app.ini` print each stage without touching the working tree.
  - `git merge -X theirs` favours theirs only inside conflicted hunks (see a later mission).
  - A follow-up commit on `german-review` should revert the staging URL so this does not recur.

  ## Pitfalls
  - Swapping `--ours` and `--theirs`: it is easy to confuse them, check the file afterwards.
  - During a rebase the meaning is reversed.
common_mistakes:
  - Taking `--theirs` for both files and shipping the staging API URL.
  - Taking `--ours` for both files and losing the native-speaker translation.
  - Not running `git add` after the checkout, so the files stay unmerged.
validators:
  - type: script_passes
    script: test "$(git rev-list --parents -n1 HEAD | wc -w | tr -d ' ')" = "3" && git merge-base --is-ancestor german-review HEAD
    description: HEAD merges german-review
  - type: script_passes
    script: test "$(git show HEAD:lang/de.json)" = "$(git show german-review:lang/de.json)"
    description: lang/de.json is exactly Eva's version
  - type: script_passes
    script: git diff --quiet HEAD^1 HEAD -- app.ini && grep -q 'https://api.tours.example/v2' app.ini
    description: app.ini is exactly the version from main (production API)
  - type: no_conflict_markers
    description: No conflict markers remain
  - type: no_unmerged_files
    description: No unmerged paths remain
  - type: is_clean
    description: Working tree is clean
