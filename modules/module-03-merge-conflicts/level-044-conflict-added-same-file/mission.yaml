name: Conflict - Both Added Same File
module: module-03-merge-conflicts
level: level-044-conflict-added-same-file
order: 44
difficulty: intermediate
xp: 240
expected_time: 10m
concepts:
  - add/add conflict
  - no common base
  - merging two documents
description: |
  The open-source knitting-chart generator `knitgen` had no contributor guide. Maya wrote `CONTRIBUTING.md` with a
  "Code style" section on the branch `contributing-style`. Independently, Ola created a file with the same name on
  `main`, with a "Commit messages" section. Because the file did not exist in their common ancestor, Git calls this an
  add/add conflict and has no base version at all to compare with. Both sections are valuable and should end up in a single guide.
objective: |
  Merge `contributing-style` into `main` so that `CONTRIBUTING.md` contains the title once, the `## Code style`
  section with both its bullet points and the `## Commit messages` section with both its bullet points, and no
  markers. Complete the merge commit.
hints:
  - "`git status` shows `both added: CONTRIBUTING.md`. Both versions start with the same title line."
  - "Edit the file so that the heading appears once, then the two sections one after the other. Remove all marker lines."
  - "`git add CONTRIBUTING.md` and `git commit` finish the merge."
guide: |
  ## 1. Merge
  ```bash
  git merge contributing-style
  git status
  ```
  `both added: CONTRIBUTING.md`.

  ## 2. Read it
  ```bash
  cat CONTRIBUTING.md
  ```
  Git shows both complete versions, separated by markers, with the title line possibly shared on top.

  ## 3. Build one document
  The final file should be:
  ```
  # Contributing to knitgen

  ## Code style
  ...two bullets...

  ## Commit messages
  ...two bullets...
  ```

  ## 4. Finish
  ```bash
  git add CONTRIBUTING.md
  git commit
  ```
debrief: |
  ## What happened
  When two branches add a file with the same name and different content, there is no common ancestor version
  for a three-way merge. Git falls back to comparing the two files with an empty base, which usually makes every
  differing line conflict. You assembled the union by hand.

  ## Why it matters
  Newly added documents (README, CONTRIBUTING, .gitignore, CI files) are the typical add/add conflicts in
  young projects. They are usually easy to resolve but need a human to decide on structure.

  ## Related
  - `git checkout --ours|--theirs CONTRIBUTING.md` keeps just one of the two.
  - `git show :2:CONTRIBUTING.md` and `:3:` show each version.
  - Pull requests that both create the same file are best coordinated in advance.

  ## Pitfalls
  - Duplicate title lines or duplicated sections.
  - Dropping a section because the "other" version looks more complete.
common_mistakes:
  - Keeping only one version with `--ours` or `--theirs`, discarding the other author's section.
  - Leaving both `# Contributing to knitgen` titles in the file.
  - Leaving marker lines in the Markdown, which renders as junk.
validators:
  - type: script_passes
    script: test "$(git rev-list --parents -n1 HEAD | wc -w | tr -d ' ')" = "3" && git merge-base --is-ancestor contributing-style HEAD
    description: HEAD merges contributing-style
  - type: script_passes
    script: "grep -qx '## Code style' CONTRIBUTING.md && grep -qx '## Commit messages' CONTRIBUTING.md && grep -q 'black' CONTRIBUTING.md && grep -q 'Fixes #12' CONTRIBUTING.md"
    description: Both sections are present
  - type: script_passes
    script: grep -q 'under 40 lines' CONTRIBUTING.md && grep -q 'imperative mood' CONTRIBUTING.md
    description: All four bullet points are present
  - type: script_passes
    script: test "$(grep -c '^# Contributing to knitgen$' CONTRIBUTING.md)" = "1"
    description: The title appears exactly once
  - type: no_conflict_markers
    description: No conflict markers remain
  - type: no_unmerged_files
    description: No unmerged paths remain
  - type: is_clean
    description: Working tree is clean
