name: Keep Our Version
module: module-03-merge-conflicts
level: level-040-keep-ours
order: 40
difficulty: intermediate
xp: 220
expected_time: 10m
concepts:
  - git checkout --ours <file>
  - generated files
  - whole-file resolution
description: |
  Sofia's garden irrigation controller keeps its pinned dependencies in `requirements.lock`, a file generated by
  tooling that must never be edited by hand. Theo's feature branch `feature/moisture-alert` regenerated the lock
  file on his laptop with older versions, while `main` just received a lock file regenerated by CI with security
  updates. Merging produces a conflict in the lock file. Merging by editing markers in a generated file makes no
  sense: the version on `main` is the correct one as a whole. Theo's real work, the new function in `controller.py`,
  should still arrive.
objective: |
  Merge `feature/moisture-alert` into `main`. For `requirements.lock` keep exactly the version that was on `main`
  before the merge (byte for byte). `controller.py` must contain Theo's new `soil_moisture_alert` function. Finish
  with a merge commit and a clean working tree.
hints:
  - "`git status` shows only the lock file as conflicted; `controller.py` was merged automatically."
  - "Instead of editing markers you can take one whole side of a file: `git checkout --ours <file>` keeps the current branch's version during a merge."
  - "`git checkout --ours requirements.lock`, `git add requirements.lock`, `git commit`."
guide: |
  ## 1. Merge and see what conflicts
  ```bash
  git merge feature/moisture-alert
  git status
  ```
  Only `requirements.lock` is unmerged.

  ## 2. Take our whole file
  ```bash
  git checkout --ours requirements.lock
  cat requirements.lock
  ```
  During a merge, "ours" is the branch you are on (`main`), "theirs" is the one being merged in.
  The checkout replaces the conflicted file with `main`'s complete version, markers included gone.

  ## 3. Mark and commit
  ```bash
  git add requirements.lock
  git commit -m "Merge feature/moisture-alert, keep CI-generated lock file"
  ```
debrief: |
  ## What happened
  Git kept three versions of the lock file in the index (base, ours, theirs). `git checkout --ours` copied the
  "ours" stage into the working tree; `git add` then marked the conflict as resolved with that content.

  ## Why it matters
  Generated and binary files (lock files, compiled assets, minified bundles) cannot be merged line by line.
  The usual rule is to keep one side and regenerate if needed.

  ## Related
  - `git merge -X ours` applies "ours" only to conflicting hunks of every file, which is not the same.
  - `git merge -s ours` (a later mission) ignores the other branch's content entirely.
  - Many projects add `merge=ours`-style drivers or regenerate lock files after the merge.

  ## Pitfalls
  - "Ours" and "theirs" swap meaning during a rebase.
  - The file keeps being "unmerged" until you `git add` it.
common_mistakes:
  - Editing the markers by hand and ending up with a mixture of versions that no tool generated.
  - Using `--theirs`, which installs Theo's outdated versions.
  - Using `git merge -s ours`, which would also drop `controller.py`'s new function.
validators:
  - type: script_passes
    script: test "$(git rev-list --parents -n1 HEAD | wc -w | tr -d ' ')" = "3" && git merge-base --is-ancestor feature/moisture-alert HEAD
    description: HEAD merges feature/moisture-alert
  - type: script_passes
    script: git diff --quiet HEAD^1 HEAD -- requirements.lock && grep -qx 'flask==3.0.3' requirements.lock
    description: requirements.lock is exactly the version from main
  - type: file_content_contains
    path: controller.py
    text: def soil_moisture_alert(level)
    description: controller.py has the new function
  - type: no_conflict_markers
    description: No conflict markers remain
  - type: no_unmerged_files
    description: No unmerged paths remain
  - type: is_clean
    description: Working tree is clean
