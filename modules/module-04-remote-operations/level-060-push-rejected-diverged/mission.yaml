name: 'Push Rejected: Diverged History'
module: module-04-remote-operations
level: level-060-push-rejected-diverged
order: 60
difficulty: intermediate
xp: 250
expected_time: 9m
concepts:
- "`! [rejected]` \u2014 pull first"
- then push
common_mistakes:
- "Running commands related to `! [rejected]` \u2014 pull first, then push without\
  \ checking `git status` first, which hides the actual repository state."
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
repo_path: local
description: This mission uses a local bare repository to simulate a remote server.
objective: Resolve the diverged history by integrating `origin/main`, then push successfully.
hints:
- Work in the `local/` directory inside the sandbox.
- Inspect remotes with `git remote -v` and branches with `git branch -a`.
- Use the remote command named in the mission objective.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cd local\n   ```\n\n2.\n   ```bash\n\
  \   git pull --no-rebase origin main\n   ```\n\n3.\n   ```bash\n   git push origin\
  \ main\n   ```"
debrief: '## What Just Happened


  **Push Rejected: Diverged History**


  Local bare repos are a great way to practice remote workflows without needing any
  network services.

  '
validators:
- type: ahead_of
  other: origin/main
  count: 0
  description: Local branch is synchronized with origin/main
- type: script_passes
  description: Remote contains the local change
  script: git show origin/main:local.txt >/dev/null 2>&1
