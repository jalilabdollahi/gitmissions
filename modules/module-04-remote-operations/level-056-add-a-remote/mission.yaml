name: Add a Remote
module: module-04-remote-operations
level: level-056-add-a-remote
order: 56
difficulty: intermediate
xp: 200
expected_time: 8m
concepts:
  - git remote add
  - git push -u
  - upstream tracking
repo_path: newsletter
description: |
  You maintain the Brightletter newsletter platform, a small Python service that renders and sends
  weekly digests. Until now the repository only lived on your laptop. The platform team has just
  created an empty bare repository for it on the shared git host; in this sandbox it sits next to
  your project as `../hosting.git`.
  Your local repo has a `main` branch with the real history, and a private `draft-templates` branch
  you are not ready to share.
objective: |
  Connect the local repo to the hosting repository and publish `main`:
  - add a remote named `origin` that points to `../hosting.git`
  - push `main` to it and make `origin/main` the upstream of your local `main`
  - `../hosting.git` must end up with `main` at exactly the same commit as your local `main`
hints:
  - "Run `git remote -v`. It prints nothing, so the repository knows no remote yet."
  - "`git remote add <name> <url>` registers a remote. The url can be a relative path to a bare repository."
  - "After adding it, `git push -u origin main` uploads the branch and records it as upstream in one step."
guide: |
  ## 1. Look at what you have
  ```bash
  git remote -v
  git branch
  ```
  No remotes are listed, so there is nowhere to push yet.

  ## 2. Register the remote
  ```bash
  git remote add origin ../hosting.git
  git remote -v
  ```
  `origin` is only a nickname stored in `.git/config`. Any name works, but `origin` is the convention.

  ## 3. Publish main and set the upstream
  ```bash
  git push -u origin main
  ```
  `-u` (`--set-upstream`) stores `branch.main.remote` and `branch.main.merge`, so later a bare
  `git push` or `git pull` knows where to go.

  ## 4. Check
  ```bash
  git status -sb
  git branch -vv
  ```
  You should see `main...origin/main` with no ahead/behind counters.
debrief: |
  ## What happened
  A remote is just a named URL plus a fetch refspec in `.git/config`. `git remote add` wrote those
  two lines, and `git push -u` sent your objects over and created the remote-tracking branch
  `origin/main` on your side.

  ## Why the upstream matters
  Without `-u`, the first `git push` fails with "has no upstream branch", and `git status` cannot tell
  you how far ahead or behind you are. Newer Git can do this automatically with `push.autoSetupRemote`,
  but you should not rely on it being enabled on every machine.

  ## Only main left
  `draft-templates` stayed private on purpose. `git push origin main` sends exactly one branch, whereas
  `git push --all` would have published every local branch.

  ## Related
  - `git remote set-url origin <url>` changes the address later.
  - `git remote rename old new` and `git remote remove name` manage the list.
  - `git config --get remote.origin.url` prints the stored address.
common_mistakes:
  - "Adding the remote but never pushing, so `../hosting.git` stays empty."
  - "Pushing with `git push --all`, which also publishes the private draft-templates branch."
  - "Pushing without `-u`, so `main` has no upstream and `git pull` complains."
validators:
  - type: remote_exists
    name: origin
    description: A remote named origin exists
  - type: script_passes
    script: git remote get-url origin | grep -q 'hosting.git'
    description: origin points at the hosting repository
  - type: script_passes
    script: test "$(git --git-dir=../hosting.git rev-parse refs/heads/main)" = "$(git rev-parse main)"
    description: hosting.git has main at the same commit as your local main
  - type: script_passes
    script: test "$(git config branch.main.remote)" = origin && test "$(git config branch.main.merge)" = refs/heads/main
    description: Local main tracks origin/main
