name: Prune Stale Remote Refs
module: module-04-remote-operations
level: level-066-prune-stale-remotes
order: 66
difficulty: intermediate
xp: 230
expected_time: 9m
concepts:
  - git fetch --prune
  - stale remote-tracking branches
  - fetch.prune
repo_path: staybridge
description: |
  In the Staybridge hotel-booking repository teammates delete their branches on the server after merging.
  Your clone still lists them: `git branch -r` shows `origin/feature/late-checkout` and
  `origin/feature/pet-fees`, yet both are gone from the server, and your local `feature/late-checkout`
  still points at a dead upstream. `feature/spa-addons` is alive and unmerged, so it must stay both on
  the remote and locally. Clean up your clone and stop this from happening again.
objective: |
  - remove the stale remote-tracking branches so that only `origin/main` and `origin/feature/spa-addons` remain
  - delete the local branch `feature/late-checkout` (its work is merged), but keep `feature/spa-addons`
  - make this repo prune automatically on every fetch (`fetch.prune` set to `true` locally)
hints:
  - "`git branch -vv` marks local branches whose upstream no longer exists with `: gone]`."
  - "`git fetch --prune` (or `git remote prune origin`) removes remote-tracking refs that no longer exist on the server."
  - "`git fetch --prune`, then `git branch -d feature/late-checkout`, then `git config fetch.prune true`."
guide: |
  ## 1. Spot the stale refs
  ```bash
  git branch -r
  git branch -vv
  git remote show origin
  ```
  `remote show` labels the dead ones as "stale".

  ## 2. Prune them
  ```bash
  git fetch --prune
  git branch -r
  ```
  Only the refs that vanished from the server are removed.

  ## 3. Delete the local branch whose upstream is gone
  ```bash
  git branch -d feature/late-checkout
  ```
  `-d` is allowed because the work is merged into `main`.

  ## 4. Automate
  ```bash
  git config fetch.prune true
  ```
debrief: |
  ## What happened
  Deleting a branch on the server does not notify your clone. Its `origin/*` pointer stays until a
  prune removes it. Pruning only touches remote-tracking refs, never your own local branches.

  ## Why it matters
  Stale refs make tab completion noisy and let you branch from work that no longer exists. They also
  hide the real list of active branches when you search.

  ## Settings
  `fetch.prune true` prunes on every fetch or pull. `remote.origin.prune` limits it to one remote, and
  `git config --global fetch.prune true` makes it universal.

  ## Related
  - `git remote prune origin --dry-run` previews what would go.
  - `git branch -vv | grep ': gone]'` lists local branches to clean up.
  - `git branch -D` forces deletion when the branch is not merged.
common_mistakes:
  - "Deleting local branches with `git branch -D` before checking which ones are really merged."
  - "Assuming `git fetch` alone removes the stale refs; without `--prune` it does not."
  - "Removing `feature/spa-addons`, which is still alive on the server."
validators:
  - type: script_passes
    script: test "$(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin$' | sort | tr '\n' ' ')" = "origin/feature/spa-addons origin/main "
    description: Only origin/main and origin/feature/spa-addons remain as remote-tracking branches
  - type: branch_not_exists
    branch: feature/late-checkout
    description: Local feature/late-checkout is deleted
  - type: branch_exists
    branch: feature/spa-addons
    description: Local feature/spa-addons is kept
  - type: config_equals
    key: fetch.prune
    value: "true"
    description: fetch.prune is true
