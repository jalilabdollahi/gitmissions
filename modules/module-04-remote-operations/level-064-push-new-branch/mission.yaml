name: Push a New Branch
module: module-04-remote-operations
level: level-064-push-new-branch
order: 64
difficulty: intermediate
xp: 220
expected_time: 9m
concepts:
- '`git push -u origin feature/xyz`'
common_mistakes:
- Running commands related to `git push -u origin feature/xyz` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
repo_path: local
description: This mission uses a local bare repository to simulate a remote server.
objective: Push `feature/ui` to `origin` and set upstream tracking.
hints:
- Work in the `local/` directory inside the sandbox.
- Inspect remotes with `git remote -v` and branches with `git branch -a`.
- Use the remote command named in the mission objective.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cd local\n   ```\n\n2.\n   ```bash\n\
  \   git switch -c feature/ui\n   ```\n\n3.\n   ```bash\n   printf 'ui\n' > ui.txt\n\
  \   ```\n\n4.\n   ```bash\n   git add ui.txt\n   ```\n\n5.\n   ```bash\n   git commit\
  \ -m \"Add UI work\"\n   ```\n\n6.\n   ```bash\n   git push -u origin feature/ui\n\
  \   ```"
debrief: '## What Just Happened


  **Push a New Branch**


  Local bare repos are a great way to practice remote workflows without needing any
  network services.

  '
validators:
- type: branch_exists
  branch: feature/ui
  description: feature/ui exists locally
- type: script_passes
  description: Remote branch exists
  script: git -C ../remote.git rev-parse --verify refs/heads/feature/ui >/dev/null
