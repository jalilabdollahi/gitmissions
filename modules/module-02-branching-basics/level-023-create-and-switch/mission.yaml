name: Create and Switch
module: module-02-branching-basics
level: level-023-create-and-switch
order: 23
difficulty: beginner
xp: 120
expected_time: 6m
concepts:
- '`git switch -c` / `git checkout -b`'
common_mistakes:
- Running commands related to `git switch -c` / `git checkout -b` without checking
  `git status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This sandbox starts from a simple `main` branch with one commit.
objective: Create and switch to `feature/docs`.
hints:
- Start with the Git command related to ``git switch -c` / `git checkout -b``.
- Use `git status` often so you can see the state change.
- Leave the repository in the exact end state described by the mission.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git switch -c feature/docs\n \
  \  ```"
debrief: '## What Just Happened


  **Create and Switch**


  Branches are lightweight references to commits, which makes them cheap to create
  and remove.

  '
validators:
- type: branch_exists
  branch: feature/docs
  description: feature/docs exists
- type: is_on_branch
  branch: feature/docs
  description: HEAD is on feature/docs
