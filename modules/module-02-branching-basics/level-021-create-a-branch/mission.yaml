name: Create a Branch
module: module-02-branching-basics
level: level-021-create-a-branch
order: 21
difficulty: beginner
xp: 120
expected_time: 6m
concepts:
- '`git branch <name>`'
common_mistakes:
- Running commands related to `git branch <name>` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This sandbox starts from a simple `main` branch with one commit.
objective: Create a branch named `feature/login`.
hints:
- Start with the Git command related to ``git branch <name>``.
- Use `git status` often so you can see the state change.
- Leave the repository in the exact end state described by the mission.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git branch feature/login\n   ```"
debrief: '## What Just Happened


  **Create a Branch**


  Branches are lightweight references to commits, which makes them cheap to create
  and remove.

  '
validators:
- type: branch_exists
  branch: feature/login
  description: feature/login exists
