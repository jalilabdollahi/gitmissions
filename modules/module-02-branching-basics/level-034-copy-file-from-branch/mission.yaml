name: Copy File from Another Branch
module: module-02-branching-basics
level: level-034-copy-file-from-branch
order: 34
difficulty: beginner
xp: 160
expected_time: 6m
concepts:
- '`git checkout <branch> -- <file>`'
common_mistakes:
- Running commands related to `git checkout <branch> -- <file>` without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: A file exists only on a feature branch, and you need it on `main` without
  merging the whole branch.
objective: 'Copy `release.md` from `feature/docs` into `main` and commit it with `docs:
  copy release notes`.'
hints:
- Stay on `main`.
- Use `git checkout feature/docs -- release.md`.
- Commit the copied file.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git switch main\n   ```\n\n2.\n\
  \   ```bash\n   git checkout feature/docs -- release.md\n   ```\n\n3.\n   ```bash\n\
  \   git commit -m \"docs: copy release notes\"\n   ```"
debrief: '## What Just Happened


  **Copy File from Another Branch**


  Checking out a file from another branch is a precise alternative to a full merge.

  '
validators:
- type: file_content_contains
  path: release.md
  text: Release notes
  description: release.md was copied
- type: commit_message_contains
  text: 'docs: copy release notes'
  description: Commit message is correct
- type: is_clean
  description: Working tree is clean
