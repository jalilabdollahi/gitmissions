name: Delete a Merged Branch
module: module-02-branching-basics
level: level-026-delete-merged-branch
order: 26
difficulty: beginner
xp: 130
expected_time: 6m
concepts:
- '`git branch -d`'
common_mistakes:
- Running commands related to `git branch -d` without checking `git status` first,
  which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: A temporary branch should be removed from the repository.
objective: Delete `feature/old` and leave the repo on `main`.
hints:
- List branches first.
- Use `git branch -d feature/old`.
- Stay on `main`.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   git branch -d feature/old\n  \
  \ ```"
debrief: '## What Just Happened


  **Delete a Merged Branch**


  Deleting merged branches is cleanup; force deletion is a deliberate safety override.

  '
validators:
- type: branch_not_exists
  branch: feature/old
  description: feature/old no longer exists
- type: is_on_branch
  branch: main
  description: HEAD is on main
