name: View Merged Branches
module: module-02-branching-basics
level: level-031-view-merged-branches
order: 31
difficulty: beginner
xp: 130
expected_time: 6m
concepts:
- '`git branch --merged`'
- clean up
common_mistakes:
- Running commands related to `git branch --merged`, clean up without checking `git
  status` first, which hides the actual repository state.
- Stopping after changing files but forgetting the final Git step such as `git add`,
  `git commit`, `git push`, or `git rebase --continue`.
- Using a bigger hammer than needed, like resetting the whole repository when a single
  file, branch, or ref was the real target.
description: This repo has a few local branches to inspect.
objective: 'Inspect the branch list and create `merged.txt` containing exactly:


  `feature/merged`


  Then commit it with `docs: record branches`.'
hints:
- Use `git branch` or `git branch --merged` depending on the mission.
- Write the exact answer into `merged.txt`.
- Commit the report.
guide: "## Step-by-step Guide\n\n1.\n   ```bash\n   cat > merged.txt <<'EOF'\nfeature/merged\n\
  EOF\n   ```\n\n2.\n   ```bash\n   git add merged.txt\n   ```\n\n3.\n   ```bash\n\
  \   git commit -m \"docs: record branches\"\n   ```"
debrief: '## What Just Happened


  **View Merged Branches**


  Branch inspection commands help you clean up stale work safely.

  '
validators:
- type: file_content_equals
  path: merged.txt
  text: feature/merged
  description: merged.txt contains the expected answer
- type: commit_message_contains
  text: 'docs: record branches'
  description: 'Latest commit message contains ''docs: record branches'''
- type: is_clean
  description: Working tree is clean
